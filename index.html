<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rally - 3D Table Tennis Multiplayer</title>
    
    <!-- Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js untuk grafis 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- PeerJS untuk koneksi Multiplayer (WebRTC) -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f5; /* Tailwind zinc-100 */
            color: #18181b; /* Tailwind zinc-900 */
            touch-action: none;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlays */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Biarkan klik tembus ke canvas saat main */
        }
        
        /* Menu Panel harus bisa diklik */
        .interactive-ui {
            pointer-events: auto;
        }

        /* Glassmorphism style untuk menu */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        /* Animasi Ping */
        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .status-dot {
            height: 10px; width: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        /* Custom Input Styling */
        input:focus {
            outline: none;
            border-color: #3f3f46;
            box-shadow: 0 0 0 3px rgba(63, 63, 70, 0.1);
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="uiLayer" class="flex flex-col justify-between p-6 md:p-10">
        
        <!-- Header In-Game (Awalnya Sembunyi) -->
        <div id="inGameHeader" class="hidden flex justify-between items-start w-full max-w-6xl mx-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-red-500 shadow-lg flex items-center justify-center text-white font-bold" id="p1Avatar">P1</div>
                <div>
                    <h2 id="p1NameLabel" class="font-bold text-sm md:text-base uppercase tracking-wider text-zinc-800">HOST</h2>
                    <p class="text-xs text-zinc-500 font-semibold" id="roomDisplay">Room: ----</p>
                </div>
            </div>
            
            <!-- Score Board (Tengah) -->
            <div class="flex flex-col items-center">
                <p class="text-xs font-bold tracking-widest text-zinc-400 mb-1">MATCH SCORE</p>
                <div class="flex items-baseline space-x-4">
                    <span id="scoreP1" class="text-5xl md:text-6xl font-extrabold text-zinc-800">00</span>
                    <span class="text-2xl text-zinc-300">-</span>
                    <span id="scoreP2" class="text-5xl md:text-6xl font-extrabold text-zinc-800">00</span>
                </div>
                <div id="gameStatusText" class="mt-2 px-3 py-1 bg-white/50 rounded-full text-xs font-bold text-zinc-600 shadow-sm backdrop-blur-sm">
                    WAITING TO SERVE
                </div>
            </div>

            <div class="flex items-center space-x-3 text-right">
                <div>
                    <h2 id="p2NameLabel" class="font-bold text-sm md:text-base uppercase tracking-wider text-zinc-800">GUEST</h2>
                    <p class="text-xs text-zinc-500 font-semibold flex items-center justify-end space-x-1">
                        <span>Connected</span>
                        <span class="status-dot"></span>
                    </p>
                </div>
                <div class="w-10 h-10 rounded-full bg-slate-800 shadow-lg flex items-center justify-center text-white font-bold" id="p2Avatar">P2</div>
            </div>
        </div>

        <!-- Main Menu Panel -->
        <div id="menuPanel" class="interactive-ui flex-1 flex items-center justify-center absolute inset-0">
            <div class="glass-panel p-8 md:p-12 rounded-3xl max-w-md w-full mx-4 relative overflow-hidden">
                <!-- Dekorasi UI -->
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-red-400 rounded-full opacity-10 blur-3xl"></div>
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-blue-400 rounded-full opacity-10 blur-3xl"></div>

                <div class="text-center mb-8 relative z-10">
                    <h1 class="text-4xl font-extrabold tracking-tighter text-zinc-900 mb-1">RALLY <span class="text-red-500">3D</span></h1>
                    <p class="text-sm font-medium text-zinc-500 tracking-widest uppercase">The Everyday Club</p>
                </div>

                <div id="alertBox" class="hidden mb-6 p-3 bg-red-50 text-red-600 rounded-lg border border-red-100 text-sm font-medium text-center">
                    Alert Message Here
                </div>

                <!-- Input Setup -->
                <div id="setupSection" class="space-y-5 relative z-10">
                    <div>
                        <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Player Name</label>
                        <input type="text" id="playerName" placeholder="Enter your name" class="w-full bg-white/80 border-2 border-zinc-200 rounded-xl px-4 py-3 text-zinc-800 font-semibold transition-all" maxlength="10">
                    </div>

                    <div class="pt-4 space-y-3">
                        <button onclick="hostGame()" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-bold py-4 rounded-xl shadow-lg transition-transform transform hover:scale-[1.02] active:scale-95">
                            CREATE ROOM (HOST)
                        </button>
                        
                        <div class="relative flex items-center py-2">
                            <div class="flex-grow border-t border-zinc-300"></div>
                            <span class="flex-shrink-0 mx-4 text-zinc-400 text-xs font-bold uppercase tracking-wider">OR</span>
                            <div class="flex-grow border-t border-zinc-300"></div>
                        </div>

                        <div class="flex space-x-2">
                            <input type="text" id="joinId" placeholder="Paste Room ID" class="w-2/3 bg-white/80 border-2 border-zinc-200 rounded-xl px-4 py-3 text-zinc-800 font-mono text-sm transition-all uppercase">
                            <button onclick="joinGame()" class="w-1/3 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl shadow-lg transition-transform transform hover:scale-[1.02] active:scale-95">
                                JOIN
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Waiting Room (Host Only) -->
                <div id="waitingSection" class="hidden text-center space-y-6 relative z-10 py-4">
                    <div>
                        <p class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Your Room ID</p>
                        <div class="bg-zinc-100 border-2 border-zinc-200 p-4 rounded-xl flex items-center justify-between">
                            <span id="displayRoomId" class="font-mono text-lg font-bold text-zinc-800 tracking-wider">Loading...</span>
                            <button onclick="copyId()" id="copyBtn" class="bg-white border border-zinc-200 shadow-sm px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-700 hover:bg-zinc-50 transition-colors">
                                COPY
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center space-y-3">
                        <div class="w-8 h-8 border-4 border-zinc-200 border-t-red-500 rounded-full animate-spin"></div>
                        <p class="text-sm font-medium text-zinc-500">Waiting for opponent...</p>
                    </div>
                    <button onclick="cancelMatch()" class="text-xs font-bold text-zinc-400 hover:text-red-500 uppercase tracking-wider">Cancel</button>
                </div>
            </div>
        </div>
        
        <!-- Game Over UI -->
        <div id="gameOverPanel" class="hidden interactive-ui flex-1 flex flex-col items-center justify-center absolute inset-0 bg-white/80 backdrop-blur-md">
            <h2 class="text-6xl font-black text-zinc-900 mb-2 uppercase tracking-tighter" id="winnerText">WINNER</h2>
            <p class="text-lg font-bold text-zinc-500 mb-8 tracking-widest">WINS THE MATCH</p>
            <button onclick="restartMatch()" class="bg-red-500 hover:bg-red-600 text-white px-10 py-4 rounded-full font-bold shadow-xl shadow-red-500/30 transition-transform transform hover:scale-105">
                PLAY AGAIN
            </button>
        </div>
        
        <!-- Footer Info -->
        <div class="absolute bottom-4 left-0 w-full text-center pointer-events-none">
            <p class="text-xs font-semibold text-zinc-400 tracking-widest">MOVE MOUSE TO PLAY • CLICK TO SERVE</p>
        </div>
    </div>

    <!-- MAIN LOGIC (Three.js + PeerJS) -->
    <script>
        // -- UI Elements --
        const menuPanel = document.getElementById('menuPanel');
        const setupSection = document.getElementById('setupSection');
        const waitingSection = document.getElementById('waitingSection');
        const inGameHeader = document.getElementById('inGameHeader');
        const gameOverPanel = document.getElementById('gameOverPanel');
        const alertBox = document.getElementById('alertBox');
        
        // -- Game Variables --
        let isHost = false;
        let myName = localStorage.getItem('rally_name') || 'Player';
        document.getElementById('playerName').value = myName;
        
        let peer = null;
        let conn = null;
        let gameActive = false;
        let lastTime = 0;
        let mouseX = 0;
        let mouseY = 0;

        // Game State (Diatur oleh Host)
        let state = {
            status: 'menu', // menu, serve, rally, gameover
            score: { p1: 0, p2: 0 },
            server: 'p1', // siapa yang servis
            ball: { x: 0, y: 1.5, z: 0, vx: 0, vy: 0, vz: 0 },
            p1: { x: 0, y: 1 }, // Host (Red)
            p2: { x: 0, y: 1 }, // Guest (Blue)
            winner: null
        };

        const MAX_SCORE = 11;
        const TABLE_WIDTH = 15;
        const TABLE_LENGTH = 27;
        const TABLE_HEIGHT = 7.6; // Ketinggian meja dari lantai
        
        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 3000);
        }

        function initNetwork(callback) {
            if (peer) peer.destroy();
            peer = new Peer(null, { debug: 2 });
            
            peer.on('open', (id) => {
                callback(id);
            });
            peer.on('error', (err) => {
                showAlert("Network Error: " + err.type);
                cancelMatch();
            });
        }

        function hostGame() {
            myName = document.getElementById('playerName').value.trim() || 'Host';
            localStorage.setItem('rally_name', myName);
            isHost = true;
            
            setupSection.classList.add('hidden');
            waitingSection.classList.remove('hidden');
            
            initNetwork((id) => {
                document.getElementById('displayRoomId').textContent = id;
                
                peer.on('connection', (connection) => {
                    if (conn) { connection.close(); return; }
                    conn = connection;
                    setupConnection();
                });
            });
        }

        function joinGame() {
            const hostId = document.getElementById('joinId').value.trim();
            if (!hostId) { showAlert("Please enter Room ID"); return; }
            
            myName = document.getElementById('playerName').value.trim() || 'Guest';
            localStorage.setItem('rally_name', myName);
            isHost = false;
            
            setupSection.classList.add('hidden');
            
            initNetwork((id) => {
                conn = peer.connect(hostId, { reliable: true });
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                // Send Name
                conn.send({ type: 'init', name: myName });
                startGameUI();
            });

            conn.on('data', (data) => {
                if (isHost) {
                    if (data.type === 'init') {
                        document.getElementById('p2NameLabel').textContent = data.name;
                        document.getElementById('p2Avatar').textContent = data.name.charAt(0).toUpperCase();
                        resetGame(); // Mulai game
                    }
                    if (data.type === 'paddleUpdate') {
                        state.p2.x = data.x;
                        state.p2.y = data.y;
                    }
                    if (data.type === 'serveRequest' && state.status === 'serve' && state.server === 'p2') {
                        executeServe();
                    }
                } else {
                    if (data.type === 'init') {
                        document.getElementById('p1NameLabel').textContent = data.name;
                        document.getElementById('p1Avatar').textContent = data.name.charAt(0).toUpperCase();
                    }
                    if (data.type === 'stateUpdate') {
                        syncState(data.state);
                    }
                }
            });

            conn.on('close', () => {
                showAlert("Opponent disconnected.");
                cancelMatch();
            });
        }

        function copyId() {
            const id = document.getElementById('displayRoomId').textContent;
            navigator.clipboard.writeText(id).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = 'COPIED';
                setTimeout(() => btn.textContent = 'COPY', 2000);
            });
        }

        function cancelMatch() {
            if (conn) conn.close();
            if (peer) peer.destroy();
            setupSection.classList.remove('hidden');
            waitingSection.classList.add('hidden');
            menuPanel.classList.remove('hidden');
            inGameHeader.classList.add('hidden');
            gameOverPanel.classList.add('hidden');
            gameActive = false;
        }

        function startGameUI() {
            menuPanel.classList.add('hidden');
            inGameHeader.classList.remove('hidden');
            
            // Set own info
            if (isHost) {
                document.getElementById('p1NameLabel').textContent = myName;
                document.getElementById('p1Avatar').textContent = myName.charAt(0).toUpperCase();
                document.getElementById('roomDisplay').textContent = "Room: " + peer.id;
            } else {
                document.getElementById('p2NameLabel').textContent = myName;
                document.getElementById('p2Avatar').textContent = myName.charAt(0).toUpperCase();
                document.getElementById('roomDisplay').textContent = "Connected";
            }
            
            gameActive = true;
            resizeCanvas(); // Ensure 3D is sized correctly
        }

        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Shadow yang lembut

        const scene = new THREE.Scene();
        // Background color (sama dengan CSS body)
        scene.background = new THREE.Color('#f4f4f5'); 

        // Kamera: Sudut pandang persis seperti video (dari belakang Host, sedikit di atas meja)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30); 
        camera.lookAt(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(10, 25, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        const objects = {};

        // 1. Lantai (Hanya untuk menerima bayangan agar terlihat grounded)
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.ShadowMaterial({ opacity: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -TABLE_HEIGHT; // Lantai ada di bawah meja
        floor.receiveShadow = true;
        scene.add(floor);

        // 2. Meja (Dark Green, Aesthetic)
        const tableGroup = new THREE.Group();
        
        // Permukaan Meja
        const tableTopGeo = new THREE.BoxGeometry(TABLE_WIDTH, 0.5, TABLE_LENGTH);
        const tableTopMat = new THREE.MeshStandardMaterial({ 
            color: '#2d6a4f', // Aesthetic dark green
            roughness: 0.4,
            metalness: 0.1
        });
        const tableTop = new THREE.Mesh(tableTopGeo, tableTopMat);
        tableTop.receiveShadow = true;
        tableTop.castShadow = true;
        tableGroup.add(tableTop);

        // Garis Putih (Tengah, Pinggir)
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.1, TABLE_LENGTH), lineMat);
        centerLine.rotation.x = -Math.PI / 2;
        centerLine.position.y = 0.26; // Sedikit di atas meja
        tableGroup.add(centerLine);

        const borderGeo = new THREE.BoxGeometry(TABLE_WIDTH + 0.4, 0.6, TABLE_LENGTH + 0.4);
        const borderMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const tableBorder = new THREE.Mesh(borderGeo, borderMat);
        tableBorder.position.y = -0.05;
        tableGroup.add(tableBorder);

        // Net
        const netGeo = new THREE.PlaneGeometry(TABLE_WIDTH + 1, 1.5);
        const netMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            transparent: true, 
            opacity: 0.4, 
            side: THREE.DoubleSide,
            wireframe: true // Efek jaring
        });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.y = 1;
        tableGroup.add(net);

        scene.add(tableGroup);

        // 3. Paddles (Raket bentuk bundar)
        function createPaddle(colorHex) {
            const group = new THREE.Group();
            
            // Karet raket (Silinder dipipihkan)
            const padGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.3, 32);
            const padMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.7 });
            const pad = new THREE.Mesh(padGeo, padMat);
            pad.rotation.x = Math.PI / 2; // Berdirikan
            pad.castShadow = true;
            group.add(pad);

            // Gagang Kayu
            const handleGeo = new THREE.BoxGeometry(0.6, 2, 0.4);
            const handleMat = new THREE.MeshStandardMaterial({ color: '#d4a373' });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -2;
            handle.castShadow = true;
            group.add(handle);

            return group;
        }

        objects.p1 = createPaddle('#ef4444'); // Red (Host)
        objects.p1.position.z = TABLE_LENGTH / 2 + 1;
        scene.add(objects.p1);

        objects.p2 = createPaddle('#1e293b'); // Dark Slate (Guest)
        objects.p2.position.z = -(TABLE_LENGTH / 2) - 1;
        scene.add(objects.p2);

        // 4. Bola
        const ballGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: '#f59e0b', roughness: 0.2 });
        objects.ball = new THREE.Mesh(ballGeo, ballMat);
        objects.ball.castShadow = true;
        scene.add(objects.ball);

        // Mapping koordinat layar ke koordinat bidang raket 3D
        function updateMousePos(e) {
            if (!gameActive) return;
            
            // Normalized Device Coordinates (-1 to +1)
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            // Map layar X ke pergerakan Meja X (-8 to +8)
            const targetX = ((clientX / window.innerWidth) * 2 - 1) * 10;
            // Map layar Y ke pergerakan Ketinggian Y (1 to 6)
            const targetY = (-(clientY / window.innerHeight) * 2 + 1) * 4 + 3;

            if (isHost) {
                state.p1.x = targetX;
                state.p1.y = targetY;
            } else {
                state.p2.x = -targetX; // Guest melihat dari sisi berlawanan, invers X
                state.p2.y = targetY;
                // Kirim posisi ke host
                if (conn && conn.open) {
                    conn.send({ type: 'paddleUpdate', x: state.p2.x, y: state.p2.y });
                }
            }
        }

        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('touchmove', updateMousePos, {passive: false});
        
        // Serve Action
        window.addEventListener('pointerdown', () => {
            if (!gameActive || state.status !== 'serve') return;
            
            if (isHost && state.server === 'p1') {
                executeServe();
            } else if (!isHost && state.server === 'p2') {
                if (conn && conn.open) conn.send({ type: 'serveRequest' });
            }
        });

        const GRAVITY = 0.015;
        let rallyCount = 0;

        function resetGame() {
            state.score = { p1: 0, p2: 0 };
            state.server = 'p1';
            state.winner = null;
            gameOverPanel.classList.add('hidden');
            setupServe();
        }

        function restartMatch() {
            if (isHost) {
                resetGame();
            } else {
                showAlert("Waiting for Host to restart...");
            }
        }

        function setupServe() {
            state.status = 'serve';
            state.ball.vx = 0;
            state.ball.vy = 0;
            state.ball.vz = 0;
            rallyCount = 0;
            
            // Tempatkan bola melayang di atas meja pihak yang serve
            state.ball.x = 0;
            state.ball.y = 2;
            state.ball.z = state.server === 'p1' ? (TABLE_LENGTH / 2 - 2) : -(TABLE_LENGTH / 2 - 2);
            
            updateStatusUI();
        }

        function executeServe() {
            state.status = 'rally';
            // Pukulan Serve awal melengkung ke atas
            state.ball.vy = 0.3; 
            // Arah ke lawan
            state.ball.vz = state.server === 'p1' ? -0.4 : 0.4;
            // Sedikit menyamping acak
            state.ball.vx = (Math.random() - 0.5) * 0.2; 
            
            updateStatusUI();
        }

        function updateStatusUI() {
            const statusEl = document.getElementById('gameStatusText');
            if (state.status === 'serve') {
                statusEl.textContent = state.server === (isHost ? 'p1' : 'p2') ? "YOUR TURN TO SERVE (CLICK)" : "WAITING FOR OPPONENT TO SERVE";
                statusEl.classList.replace('text-green-600', 'text-zinc-600');
            } else if (state.status === 'rally') {
                statusEl.textContent = `RALLY: ${rallyCount}`;
                statusEl.classList.replace('text-zinc-600', 'text-green-600');
            }
        }

        function updatePhysics() {
            if (!isHost || state.status !== 'rally') return;

            const b = state.ball;
            b.x += b.vx;
            b.y += b.vy;
            b.z += b.vz;

            b.vy -= GRAVITY; // Terapkan gravitasi

            // 1. Pantulan Meja (Y-axis)
            if (b.y <= 0.55 && b.z > -TABLE_LENGTH/2 && b.z < TABLE_LENGTH/2 && b.x > -TABLE_WIDTH/2 && b.x < TABLE_WIDTH/2) {
                if (b.vy < 0) {
                    b.vy = Math.abs(b.vy) * 0.85; // Bounciness
                    b.y = 0.55;
                }
            }

            // 2. Tabrakan Net (Z = 0)
            if (Math.abs(b.z) < 0.5 && b.y < 2 && b.x > -TABLE_WIDTH/2 -1 && b.x < TABLE_WIDTH/2 + 1) {
                b.vz = -b.vz * 0.5; // Membentur net
            }

            // 3. Tabrakan Paddle 1 (Host - Z positif)
            // Cek apakah bola mendekati area Z paddle host
            if (b.z > TABLE_LENGTH/2 && b.z < TABLE_LENGTH/2 + 1.5 && b.vz > 0) {
                // Hitbox silinder sederhana: Cek jarak X dan Y bola ke pusat paddle
                const dx = b.x - state.p1.x;
                const dy = b.y - state.p1.y;
                if (Math.sqrt(dx*dx + dy*dy) < 2.5) { // Radius paddle + toleransi
                    b.vz = -(0.5 + (rallyCount * 0.02)); // Balik arah dengan speed bertambah
                    b.vy = 0.35 + (state.p1.y - b.y) * 0.1; // Efek pantulan atas berdasarkan posisi pukul
                    b.vx = -dx * 0.15; // Efek samping
                    rallyCount++;
                    updateStatusUI();
                }
            }

            // 4. Tabrakan Paddle 2 (Guest - Z negatif)
            if (b.z < -TABLE_LENGTH/2 && b.z > -TABLE_LENGTH/2 - 1.5 && b.vz < 0) {
                const dx = b.x - state.p2.x;
                const dy = b.y - state.p2.y;
                if (Math.sqrt(dx*dx + dy*dy) < 2.5) {
                    b.vz = 0.5 + (rallyCount * 0.02);
                    b.vy = 0.35 + (state.p2.y - b.y) * 0.1;
                    b.vx = -dx * 0.15;
                    rallyCount++;
                    updateStatusUI();
                }
            }

            // 5. Cek Point (Bola jatuh dari meja)
            if (b.y < -3) {
                if (b.z > 0) {
                    // Jatuh di sisi P1, P2 dapet poin
                    state.score.p2++;
                    state.server = 'p2'; // Yang menang poin servis
                } else {
                    // Jatuh di sisi P2, P1 dapet poin
                    state.score.p1++;
                    state.server = 'p1';
                }
                
                checkWinCondition();
            }

            // Kirim State ke Guest
            if (conn && conn.open) {
                // Untuk guest, kita inversi orientasi agar dia merasa bermain dari sisi kemeranya
                conn.send({ type: 'stateUpdate', state: state });
            }
        }

        function checkWinCondition() {
            if (state.score.p1 >= MAX_SCORE) {
                state.status = 'gameover';
                state.winner = 'p1';
            } else if (state.score.p2 >= MAX_SCORE) {
                state.status = 'gameover';
                state.winner = 'p2';
            } else {
                setupServe();
            }
            updateScoreUI();
        }

        function syncState(newState) {
            const oldStatus = state.status;
            state = newState;
            updateScoreUI();
            
            if (oldStatus !== state.status) {
                updateStatusUI();
            }
        }

        function updateScoreUI() {
            // Jika host, P1 adalah diri sendiri (kiri). Jika guest, diri sendiri (P2) tetep taruh kiri layar?
            // Biasanya tampilan skor tetep Host (Kiri) - Guest (Kanan) untuk konsistensi.
            document.getElementById('scoreP1').textContent = String(state.score.p1).padStart(2, '0');
            document.getElementById('scoreP2').textContent = String(state.score.p2).padStart(2, '0');

            if (state.status === 'gameover') {
                const wText = document.getElementById('winnerText');
                if (state.winner === 'p1') {
                    wText.textContent = document.getElementById('p1NameLabel').textContent;
                    wText.className = "text-6xl font-black text-red-500 mb-2 uppercase tracking-tighter";
                } else {
                    wText.textContent = document.getElementById('p2NameLabel').textContent;
                    wText.className = "text-6xl font-black text-slate-800 mb-2 uppercase tracking-tighter";
                }
                gameOverPanel.classList.remove('hidden');
            } else {
                gameOverPanel.classList.add('hidden');
            }
        }


        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderVisuals() {
            // Update Paddle 1
            // Smooth movement (lerp)
            objects.p1.position.x += (state.p1.x - objects.p1.position.x) * 0.2;
            objects.p1.position.y += (state.p1.y - objects.p1.position.y) * 0.2;
            
            // Rotasi paddle menyesuaikan posisi X agar terlihat dinamis
            objects.p1.rotation.y = -objects.p1.position.x * 0.05; 
            objects.p1.rotation.z = objects.p1.position.x * 0.05;

            // Update Paddle 2 (Guest)
            objects.p2.position.x += (state.p2.x - objects.p2.position.x) * 0.2;
            objects.p2.position.y += (state.p2.y - objects.p2.position.y) * 0.2;
            
            objects.p2.rotation.y = -objects.p2.position.x * 0.05;
            objects.p2.rotation.z = objects.p2.position.x * 0.05;

            // Update Ball
            objects.ball.position.x = state.ball.x;
            objects.ball.position.y = state.ball.y;
            objects.ball.position.z = state.ball.z;

            // Kamera Management
            if (!isHost) {
                // Balik posisi kamera 180 derajat untuk Guest agar melihat dari sisi P2
                camera.position.set(0, 15, -30);
                camera.lookAt(0, 0, 0);
            } else {
                camera.position.set(0, 15, 30);
                camera.lookAt(0, 0, 0);
            }
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            if (gameActive) {
                updatePhysics();
            }
            renderVisuals();
            
            renderer.render(scene, camera);
        }

        // Mulai Loop Animasi
        gameLoop();

    </script>
</body>
</html>

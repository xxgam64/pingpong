<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XXPONG - Cyber Arena</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #ffffff;
            touch-action: none;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        
        .interactive-ui {
            pointer-events: auto;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(139, 92, 246, 0.1);
        }

        .scoreboard-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(2, 6, 23, 0.9));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        input {
            background-color: rgba(30, 41, 59, 0.5) !important;
            color: white !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
            border-radius: 12px;
        }
        input:focus {
            outline: none;
            border-color: #ec4899 !important;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ec4899, #be185d);
            color: white;
            border-radius: 12px;
            font-weight: 900;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }
        .btn-primary:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 5px 25px rgba(236, 72, 153, 0.6); }
        .btn-primary:active { transform: translateY(1px); }

        .btn-secondary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border-radius: 12px;
            font-weight: 900;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .btn-secondary:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 5px 25px rgba(59, 130, 246, 0.6); }
        .btn-secondary:active { transform: translateY(1px); }
        
        .neon-text-pink { text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.4); }
        .neon-text-blue { text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer" class="flex flex-col p-4 md:p-8">
        
        <div id="inGameHeader" class="hidden w-full interactive-ui pointer-events-none">
            <div class="scoreboard-panel mx-auto max-w-4xl flex justify-between items-stretch rounded-2xl overflow-hidden relative">
                <!-- Decorative neon lines -->
                <div class="absolute top-0 left-0 w-1/2 h-1 bg-gradient-to-r from-pink-500 to-transparent"></div>
                <div class="absolute bottom-0 right-0 w-1/2 h-1 bg-gradient-to-l from-blue-500 to-transparent"></div>
                
                <div class="flex flex-col justify-center px-6 md:px-10 py-4 w-1/3 relative z-10">
                    <span class="text-[10px] font-bold text-pink-400 uppercase tracking-widest mb-1">HOST</span>
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-500 to-rose-600 shadow-[0_0_15px_rgba(236,72,153,0.5)] flex items-center justify-center text-sm font-black" id="p1Avatar">P1</div>
                        <span class="text-sm md:text-lg font-black text-white uppercase truncate" id="p1DisplayName">PLAYER 1</span>
                    </div>
                </div>
                
                <div class="flex flex-col items-center justify-center px-4 py-4 w-1/3 bg-slate-900/50 relative z-10 border-x border-white/5">
                    <span class="text-[9px] font-bold tracking-[0.4em] text-slate-400 mb-2">CYBER MATCH</span>
                    <div class="flex items-center space-x-6">
                        <span id="scoreP1" class="text-5xl md:text-6xl font-black text-pink-500 tracking-tighter neon-text-pink">00</span>
                        <span class="text-2xl font-bold text-slate-600">-</span>
                        <span id="scoreP2" class="text-5xl md:text-6xl font-black text-blue-400 tracking-tighter neon-text-blue">00</span>
                    </div>
                    <div id="gameStatusText" class="mt-3 text-[10px] font-bold text-white uppercase tracking-widest bg-white/10 px-4 py-1.5 rounded-full border border-white/10 backdrop-blur-sm">
                        WAITING
                    </div>
                </div>

                <div class="flex flex-col justify-center items-end px-6 md:px-10 py-4 w-1/3 relative z-10">
                    <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1" id="roomDisplay">GUEST</span>
                    <div class="flex items-center space-x-3">
                        <span class="text-sm md:text-lg font-black text-white uppercase truncate" id="p2DisplayName">PLAYER 2</span>
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-600 shadow-[0_0_15px_rgba(59,130,246,0.5)] flex items-center justify-center text-sm font-black" id="p2Avatar">P2</div>
                    </div>
                </div>

            </div>
        </div>

        <div id="menuPanel" class="interactive-ui flex-1 flex items-center justify-center absolute inset-0">
            <div class="glass-panel p-10 md:p-14 rounded-3xl max-w-md w-full mx-4 relative overflow-hidden">
                <!-- Abstract neon glows behind menu -->
                <div class="absolute -top-32 -left-32 w-64 h-64 bg-pink-600 rounded-full mix-blend-screen filter blur-[80px] opacity-40"></div>
                <div class="absolute -bottom-32 -right-32 w-64 h-64 bg-blue-600 rounded-full mix-blend-screen filter blur-[80px] opacity-40"></div>

                <div class="text-center mb-10 relative z-10">
                    <h1 class="text-6xl md:text-7xl font-black tracking-tighter text-white mb-2">XX<span class="text-pink-500 neon-text-pink">PONG</span></h1>
                    <p class="text-[10px] md:text-xs font-bold text-blue-400 tracking-[0.5em] uppercase neon-text-blue">Neon Arena</p>
                </div>

                <div id="alertBox" class="hidden mb-6 p-4 bg-rose-500/20 border border-rose-500/50 text-rose-200 rounded-xl text-xs font-bold text-center backdrop-blur-md">
                    Alert
                </div>

                <div id="setupSection" class="space-y-6 relative z-10">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 ml-1">Player Profile</label>
                        <input type="text" id="playerName" placeholder="ENTER ALIAS" class="w-full px-5 py-4 text-base font-black uppercase tracking-wider" maxlength="10">
                    </div>

                    <div class="pt-4 space-y-4">
                        <button onclick="playAI()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-black py-4 rounded-xl text-xs uppercase tracking-[0.2em] transition-colors border border-slate-700 hover:border-slate-500">
                            TRAINING VS AI
                        </button>

                        <button onclick="hostGame()" class="w-full btn-primary py-4 text-sm uppercase tracking-[0.2em]">
                            CREATE MATCH
                        </button>
                        
                        <div class="flex items-center py-2">
                            <div class="flex-grow border-t border-slate-700"></div>
                            <span class="mx-4 text-slate-500 text-[10px] font-bold uppercase tracking-widest">OR JOIN</span>
                            <div class="flex-grow border-t border-slate-700"></div>
                        </div>

                        <div class="flex space-x-3">
                            <input type="text" id="joinId" placeholder="ROOM CODE" class="w-2/3 px-4 py-4 text-sm font-mono uppercase font-bold">
                            <button onclick="joinGame()" class="w-1/3 btn-secondary py-4 text-sm uppercase tracking-widest">
                                JOIN
                            </button>
                        </div>
                    </div>
                </div>

                <div id="waitingSection" class="hidden text-center space-y-8 relative z-10 py-6">
                    <div>
                        <p class="text-[10px] font-bold text-pink-400 uppercase tracking-widest mb-3">Share Access Code</p>
                        <div class="bg-black/40 border border-white/10 p-5 rounded-xl flex items-center justify-between backdrop-blur-md">
                            <span id="displayRoomId" class="font-mono text-lg font-black text-white tracking-widest">Loading...</span>
                            <button onclick="copyId()" id="copyBtn" class="bg-pink-500 hover:bg-pink-400 px-4 py-2 rounded-lg text-xs font-black text-white transition-colors shadow-[0_0_10px_rgba(236,72,153,0.4)]">
                                COPY
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center space-y-5">
                        <div class="w-12 h-12 border-4 border-slate-800 border-t-pink-500 border-r-blue-500 rounded-full animate-spin"></div>
                        <p class="text-xs font-bold tracking-[0.2em] text-slate-400 uppercase">Scanning for challengers...</p>
                    </div>
                    <button onclick="cancelMatch()" class="text-[10px] font-bold text-slate-500 hover:text-white uppercase tracking-widest transition-colors mt-4">Abort Connection</button>
                </div>
            </div>
        </div>
        
        <div id="gameOverPanel" class="hidden interactive-ui flex-1 flex flex-col items-center justify-center absolute inset-0 bg-slate-950/90 backdrop-blur-xl z-50">
            <p class="text-sm font-bold text-slate-400 mb-4 tracking-[0.6em] uppercase">SYSTEM.MATCH_OVER</p>
            <h2 class="text-7xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-500 mb-12 uppercase tracking-tighter filter drop-shadow-[0_0_20px_rgba(236,72,153,0.3)]" id="winnerText">WINNER</h2>
            <button onclick="restartMatch()" class="bg-white text-black hover:bg-slate-200 font-black px-14 py-5 rounded-full text-sm uppercase tracking-[0.3em] transition-transform hover:scale-105 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                REINITIALIZE MATCH
            </button>
        </div>
        
        <div class="absolute bottom-8 left-0 w-full text-center pointer-events-none">
            <p id="instructionText" class="text-[10px] font-bold text-white/50 tracking-[0.4em] uppercase bg-black/30 backdrop-blur-sm border border-white/5 px-6 py-3 rounded-full inline-block shadow-lg">MOVE TO PLAY • CLICK TO SERVE</p>
        </div>
    </div>

    <script>
        const menuPanel = document.getElementById('menuPanel');
        const setupSection = document.getElementById('setupSection');
        const waitingSection = document.getElementById('waitingSection');
        const inGameHeader = document.getElementById('inGameHeader');
        const gameOverPanel = document.getElementById('gameOverPanel');
        const alertBox = document.getElementById('alertBox');
        const instructionText = document.getElementById('instructionText');
        
        let isHost = false;
        let isAI = false;
        let myName = localStorage.getItem('xxpong_name') || 'PLAYER';
        document.getElementById('playerName').value = myName;
        
        let peer = null;
        let conn = null;
        let gameActive = false;
        let rallyCount = 0;
        let aiServeTimer = 0;

        let state = {
            status: 'menu', 
            score: { p1: 0, p2: 0 },
            server: 'p1', 
            ball: { x: 0, y: 1.5, z: 0, vx: 0, vy: 0, vz: 0 },
            p1: { x: 0, y: 1 }, 
            p2: { x: 0, y: 1 }, 
            winner: null,
            lastHit: null,
            tableHit: null
        };

        const MAX_SCORE = 11;
        const TABLE_WIDTH = 15.25; 
        const TABLE_LENGTH = 27.4; 
        const TABLE_HEIGHT = 7.6; 
        
        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 3000);
        }

        function initNetwork(callback) {
            if (peer) peer.destroy();
            peer = new Peer(null, { debug: 2 });
            
            peer.on('open', (id) => {
                callback(id);
            });
            peer.on('error', (err) => {
                showAlert("Connection Error");
                cancelMatch();
            });
        }

        function playAI() {
            myName = document.getElementById('playerName').value.trim() || 'PLAYER';
            localStorage.setItem('xxpong_name', myName.toUpperCase());
            isHost = true;
            isAI = true;
            
            setupSection.classList.add('hidden');
            startGameUI();
            resetGame();
        }

        function hostGame() {
            myName = document.getElementById('playerName').value.trim() || 'HOST';
            localStorage.setItem('xxpong_name', myName.toUpperCase());
            isHost = true;
            isAI = false;
            
            setupSection.classList.add('hidden');
            waitingSection.classList.remove('hidden');
            
            initNetwork((id) => {
                document.getElementById('displayRoomId').textContent = id;
                
                peer.on('connection', (connection) => {
                    if (conn) { connection.close(); return; }
                    conn = connection;
                    setupConnection();
                });
            });
        }

        function joinGame() {
            const hostId = document.getElementById('joinId').value.trim();
            if (!hostId) { showAlert("Require Room ID"); return; }
            
            myName = document.getElementById('playerName').value.trim() || 'GUEST';
            localStorage.setItem('xxpong_name', myName.toUpperCase());
            isHost = false;
            isAI = false;
            
            setupSection.classList.add('hidden');
            
            initNetwork((id) => {
                conn = peer.connect(hostId, { reliable: true });
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                conn.send({ type: 'init', name: myName });
                startGameUI();
            });

            conn.on('data', (data) => {
                if (isHost) {
                    if (data.type === 'init') {
                        document.getElementById('p2DisplayName').textContent = data.name.toUpperCase();
                        document.getElementById('p2Avatar').textContent = data.name.substring(0, 2).toUpperCase();
                        resetGame(); 
                    }
                    if (data.type === 'paddleUpdate') {
                        state.p2.x = data.x;
                        state.p2.y = data.y;
                    }
                    if (data.type === 'serveRequest' && state.status === 'serve' && state.server === 'p2') {
                        executeServe();
                    }
                } else {
                    if (data.type === 'init') {
                        document.getElementById('p1DisplayName').textContent = data.name.toUpperCase();
                        document.getElementById('p1Avatar').textContent = data.name.substring(0, 2).toUpperCase();
                    }
                    if (data.type === 'stateUpdate') {
                        syncState(data.state);
                    }
                }
            });

            conn.on('close', () => {
                showAlert("Opponent disconnected.");
                cancelMatch();
            });
        }

        function copyId() {
            const id = document.getElementById('displayRoomId').textContent;
            navigator.clipboard.writeText(id).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = 'COPIED';
                setTimeout(() => btn.textContent = 'COPY', 2000);
            });
        }

        function cancelMatch() {
            if (conn) conn.close();
            if (peer) peer.destroy();
            setupSection.classList.remove('hidden');
            waitingSection.classList.add('hidden');
            menuPanel.classList.remove('hidden');
            inGameHeader.classList.add('hidden');
            gameOverPanel.classList.add('hidden');
            instructionText.classList.remove('hidden');
            gameActive = false;
            isAI = false;
        }

        function startGameUI() {
            menuPanel.classList.add('hidden');
            inGameHeader.classList.remove('hidden');
            instructionText.classList.add('hidden');
            
            document.getElementById('p1DisplayName').textContent = myName.toUpperCase();
            document.getElementById('p1Avatar').textContent = myName.substring(0, 2).toUpperCase();

            if (isAI) {
                document.getElementById('roomDisplay').textContent = "OFFLINE";
                document.getElementById('p2DisplayName').textContent = "BOT (AI)";
                document.getElementById('p2Avatar').textContent = "AI";
            } else if (isHost) {
                document.getElementById('roomDisplay').textContent = "ID: " + peer.id;
            } else {
                document.getElementById('p2DisplayName').textContent = myName.toUpperCase();
                document.getElementById('p2Avatar').textContent = myName.substring(0, 2).toUpperCase();
                document.getElementById('roomDisplay').textContent = "ONLINE";
            }
            
            gameActive = true;
            resizeCanvas(); 
        }

        // --- THREE.JS SETUP (Neon Cyberpunk Vibe) ---
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060212); // Deep dark purple
        scene.fog = new THREE.FogExp2(0x060212, 0.018);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 38); 
        camera.lookAt(0, -2, 0);

        // Cyber Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
        scene.add(ambientLight);

        // Pink/Magenta Neon Light
        const spotLightPink = new THREE.SpotLight(0xff0a78, 4.0);
        spotLightPink.position.set(15, 30, 15);
        spotLightPink.angle = Math.PI / 3;
        spotLightPink.penumbra = 0.8;
        spotLightPink.castShadow = true;
        spotLightPink.shadow.mapSize.width = 2048;
        spotLightPink.shadow.mapSize.height = 2048;
        spotLightPink.shadow.bias = -0.0005;
        scene.add(spotLightPink);

        // Cyan/Blue Neon Light
        const spotLightCyan = new THREE.SpotLight(0x0affff, 4.0);
        spotLightCyan.position.set(-15, 30, -15);
        spotLightCyan.angle = Math.PI / 3;
        spotLightCyan.penumbra = 0.8;
        spotLightCyan.castShadow = true;
        scene.add(spotLightCyan);
        
        // Center fill
        const pointLight = new THREE.PointLight(0x7a22ff, 1.5, 50);
        pointLight.position.set(0, 15, 0);
        scene.add(pointLight);

        const objects = {};

        // Reflective Grid Floor
        const floorGroup = new THREE.Group();
        
        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x050510,
            roughness: 0.1,
            metalness: 0.8
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -TABLE_HEIGHT; 
        floor.receiveShadow = true;
        floorGroup.add(floor);

        // Neon Grid Lines on floor
        const gridHelper = new THREE.GridHelper(200, 40, 0xec4899, 0x1e1b4b);
        gridHelper.position.y = -TABLE_HEIGHT + 0.1;
        floorGroup.add(gridHelper);
        
        scene.add(floorGroup);

        const tableGroup = new THREE.Group();
        
        // Cyber Table Top (Dark Glassy look)
        const tableTopGeo = new THREE.BoxGeometry(TABLE_WIDTH, 0.5, TABLE_LENGTH);
        const tableTopMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x0a0a1a,
            roughness: 0.2,
            metalness: 0.9,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            emissive: 0x0a0a2a,
            emissiveIntensity: 0.5
        });
        const tableTop = new THREE.Mesh(tableTopGeo, tableTopMat);
        tableTop.receiveShadow = true;
        tableTop.castShadow = true;
        tableGroup.add(tableTop);

        // Neon Table Lines
        const lineMat = new THREE.MeshStandardMaterial({ 
            color: 0x0affff, 
            emissive: 0x0affff,
            emissiveIntensity: 2.0
        });
        const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.15, TABLE_LENGTH), lineMat);
        centerLine.rotation.x = -Math.PI / 2;
        centerLine.position.y = 0.26; 
        tableGroup.add(centerLine);

        // Glowing border
        const borderGeo = new THREE.BoxGeometry(TABLE_WIDTH + 0.4, 0.6, TABLE_LENGTH + 0.4);
        const borderMat = new THREE.MeshStandardMaterial({ 
            color: 0xff0a78,
            emissive: 0xff0a78,
            emissiveIntensity: 1.5,
            wireframe: true
        });
        const tableBorder = new THREE.Mesh(borderGeo, borderMat);
        tableBorder.position.y = -0.05;
        tableGroup.add(tableBorder);

        // Holographic Legs
        const legMat = new THREE.MeshStandardMaterial({ 
            color: 0x000000, 
            metalness: 1.0,
            roughness: 0.2,
            emissive: 0x7a22ff,
            emissiveIntensity: 0.5,
            wireframe: true
        });
        const legPositions = [
            [TABLE_WIDTH/2 - 1.5, -TABLE_HEIGHT/2, TABLE_LENGTH/2 - 2],
            [-TABLE_WIDTH/2 + 1.5, -TABLE_HEIGHT/2, TABLE_LENGTH/2 - 2],
            [TABLE_WIDTH/2 - 1.5, -TABLE_HEIGHT/2, -TABLE_LENGTH/2 + 2],
            [-TABLE_WIDTH/2 + 1.5, -TABLE_HEIGHT/2, -TABLE_LENGTH/2 + 2]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.6, TABLE_HEIGHT, 0.6), legMat);
            leg.position.set(pos[0], pos[1], pos[2]);
            tableGroup.add(leg);
        });

        // Neon Net
        function createNetTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, 512, 128);
            
            ctx.strokeStyle = 'rgba(10, 255, 255, 0.5)'; // Cyan mesh
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(10, 255, 255, 1)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            for(let i=0; i<=512; i+=12) { ctx.moveTo(i, 0); ctx.lineTo(i, 128); }
            for(let j=0; j<=128; j+=12) { ctx.moveTo(0, j); ctx.lineTo(512, j); }
            ctx.stroke();
            
            ctx.fillStyle = '#ff0a78'; // Pink top
            ctx.fillRect(0, 112, 512, 16); 
            
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const netGeo = new THREE.PlaneGeometry(TABLE_WIDTH + 1.0, 1.2);
        const netMat = new THREE.MeshStandardMaterial({ 
            map: createNetTexture(),
            transparent: true,
            side: THREE.DoubleSide,
            emissive: 0x0affff,
            emissiveIntensity: 0.5,
            alphaTest: 0.1
        });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.y = 0.85;
        tableGroup.add(net);
        
        const poleMat = new THREE.MeshStandardMaterial({ color: 0xff0a78, emissive: 0xff0a78, emissiveIntensity: 1 });
        const pole1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.6, 8), poleMat);
        pole1.position.set(TABLE_WIDTH/2 + 0.4, 0.9, 0);
        tableGroup.add(pole1);
        const pole2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.6, 8), poleMat);
        pole2.position.set(-TABLE_WIDTH/2 - 0.4, 0.9, 0);
        tableGroup.add(pole2);

        scene.add(tableGroup);

        function createPaddle(coreColor, edgeColor) {
            const group = new THREE.Group();
            
            // Core
            const coreGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.2, 32);
            const coreMat = new THREE.MeshStandardMaterial({ 
                color: coreColor,
                roughness: 0.2,
                metalness: 0.8,
                emissive: coreColor,
                emissiveIntensity: 0.3
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.rotation.x = Math.PI / 2; 
            core.castShadow = true;
            group.add(core);

            // Glowing Edge
            const edgeGeo = new THREE.TorusGeometry(1.55, 0.08, 16, 64);
            const edgeMat = new THREE.MeshStandardMaterial({
                color: edgeColor,
                emissive: edgeColor,
                emissiveIntensity: 2.0
            });
            const edge = new THREE.Mesh(edgeGeo, edgeMat);
            edge.rotation.x = Math.PI / 2;
            group.add(edge);

            // Tech Handle
            const handleGeo = new THREE.BoxGeometry(0.5, 2.0, 0.3);
            const handleMat = new THREE.MeshStandardMaterial({ 
                color: 0x111111,
                roughness: 0.9,
                metalness: 0.5,
                wireframe: true
            });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -1.9;
            group.add(handle);

            return group;
        }

        objects.p1 = createPaddle(0x1a0510, 0xff0a78); // Pink Neon
        objects.p1.position.z = TABLE_LENGTH / 2 + 1;
        scene.add(objects.p1);

        objects.p2 = createPaddle(0x051a1a, 0x0affff); // Cyan Neon
        objects.p2.position.z = -(TABLE_LENGTH / 2) - 1;
        scene.add(objects.p2);

        // Glowing Energy Ball
        const ballGeo = new THREE.SphereGeometry(0.35, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            emissive: 0xffffff,
            emissiveIntensity: 2.5
        });
        objects.ball = new THREE.Mesh(ballGeo, ballMat);
        
        // Add a point light to the ball so it illuminates the table
        const ballLight = new THREE.PointLight(0xffffff, 1.0, 10);
        objects.ball.add(ballLight);
        scene.add(objects.ball);

        function updateMousePos(e) {
            if (!gameActive) return;
            
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const aspectMultiplier = camera.aspect < 1 ? 0.7 : 1; 
            const targetX = ((clientX / window.innerWidth) * 2 - 1) * 11 * aspectMultiplier;
            const targetY = (-(clientY / window.innerHeight) * 2 + 1) * 5 + 4;

            if (isHost) {
                state.p1.x = targetX;
                state.p1.y = targetY;
            } else {
                state.p2.x = -targetX; 
                state.p2.y = targetY;
                if (conn && conn.open && !isAI) {
                    conn.send({ type: 'paddleUpdate', x: state.p2.x, y: state.p2.y });
                }
            }
        }

        window.addEventListener('pointermove', updateMousePos, {passive: false});
        
        window.addEventListener('pointerdown', () => {
            if (!gameActive || state.status !== 'serve') return;
            
            if (isHost && state.server === 'p1') {
                executeServe();
            } else if (!isHost && state.server === 'p2') {
                if (conn && conn.open && !isAI) conn.send({ type: 'serveRequest' });
            }
        });

        const GRAVITY = 0.012;

        function resetGame() {
            state.score = { p1: 0, p2: 0 };
            state.server = 'p1';
            state.winner = null;
            gameOverPanel.classList.add('hidden');
            setupServe();
        }

        function restartMatch() {
            if (isHost || isAI) {
                resetGame();
            } else {
                showAlert("Waiting for Host to restart");
            }
        }

        function setupServe() {
            state.status = 'serve';
            state.ball.vx = 0;
            state.ball.vy = 0;
            state.ball.vz = 0;
            rallyCount = 0;
            aiServeTimer = 0;
            state.lastHit = null;
            state.tableHit = null;
            
            state.ball.x = 0;
            state.ball.y = 2.5;
            state.ball.z = state.server === 'p1' ? (TABLE_LENGTH / 2 - 2) : -(TABLE_LENGTH / 2 - 2);
            
            updateStatusUI();
        }

        function executeServe() {
            state.status = 'rally';
            state.ball.vy = 0.25; 
            state.ball.vz = state.server === 'p1' ? -0.3 : 0.3;
            state.ball.vx = (Math.random() - 0.5) * 0.15; 
            state.lastHit = state.server;
            state.tableHit = null;
            
            updateStatusUI();
        }

        function updateStatusUI() {
            const statusEl = document.getElementById('gameStatusText');
            if (state.status === 'serve') {
                statusEl.textContent = state.server === (isHost ? 'p1' : 'p2') ? "YOUR SERVE" : (isAI ? "COM SERVING" : "WAITING");
            } else if (state.status === 'rally') {
                statusEl.textContent = `RALLY: ${rallyCount}`;
            }
        }

        function updatePhysics() {
            if (!isHost || state.status !== 'rally') return;

            const b = state.ball;
            b.x += b.vx;
            b.y += b.vy;
            b.z += b.vz;

            b.vy -= GRAVITY; 

            if (b.y <= 0.57 && b.z > -TABLE_LENGTH/2 && b.z < TABLE_LENGTH/2 && b.x > -TABLE_WIDTH/2 && b.x < TABLE_WIDTH/2) {
                if (b.vy < 0) {
                    b.vy = Math.abs(b.vy) * 0.82; 
                    b.y = 0.57;
                    state.tableHit = (b.z > 0) ? 'p1' : 'p2';
                }
            }

            if (Math.abs(b.z) < 0.6 && b.y < 2.0 && b.x > -TABLE_WIDTH/2 -1 && b.x < TABLE_WIDTH/2 + 1) {
                if ((b.z > 0 && b.vz < 0) || (b.z < 0 && b.vz > 0)) {
                    b.vz = -b.vz * 0.3; 
                    b.z = b.z > 0 ? 0.65 : -0.65;
                }
            }

            if (b.z > TABLE_LENGTH/2 && b.z < TABLE_LENGTH/2 + 1.8 && b.vz > 0) {
                const dx = b.x - state.p1.x;
                const dy = b.y - state.p1.y;
                if (Math.sqrt(dx*dx + dy*dy) < 2.8) { 
                    b.vz = -0.38; 
                    b.vy = 0.22 + (state.p1.y - b.y) * 0.05; 
                    b.vx = dx * 0.15; 
                    rallyCount++;
                    state.lastHit = 'p1';
                    state.tableHit = null;
                    updateStatusUI();
                }
            }

            if (b.z < -TABLE_LENGTH/2 && b.z > -TABLE_LENGTH/2 - 1.8 && b.vz < 0) {
                const dx = b.x - state.p2.x;
                const dy = b.y - state.p2.y;
                if (Math.sqrt(dx*dx + dy*dy) < 2.8) {
                    b.vz = 0.38; 
                    b.vy = 0.22 + (state.p2.y - b.y) * 0.05;
                    b.vx = dx * 0.15;
                    rallyCount++;
                    state.lastHit = 'p2';
                    state.tableHit = null;
                    updateStatusUI();
                }
            }

            if (b.y < -4) {
                if (state.lastHit === 'p1') {
                    if (state.tableHit === 'p2') {
                        state.score.p1++;
                        state.server = 'p1'; 
                    } else {
                        state.score.p2++;
                        state.server = 'p2';
                    }
                } else if (state.lastHit === 'p2') {
                    if (state.tableHit === 'p1') {
                        state.score.p2++;
                        state.server = 'p2';
                    } else {
                        state.score.p1++;
                        state.server = 'p1';
                    }
                } else {
                    if (b.z > 0) {
                        state.score.p2++;
                        state.server = 'p2'; 
                    } else {
                        state.score.p1++;
                        state.server = 'p1';
                    }
                }
                
                checkWinCondition();
            }

            if (isAI) {
                const aiTargetX = b.x;
                const aiTargetY = Math.max(1, b.y - 0.5); 
                const aiSpeed = 0.06 + (rallyCount * 0.003); 
                
                state.p2.x += (aiTargetX - state.p2.x) * aiSpeed;
                state.p2.y += (aiTargetY - state.p2.y) * aiSpeed;
            }

            if (conn && conn.open && !isAI) {
                conn.send({ type: 'stateUpdate', state: state });
            }
        }

        function checkWinCondition() {
            if (state.score.p1 >= MAX_SCORE) {
                state.status = 'gameover';
                state.winner = 'p1';
            } else if (state.score.p2 >= MAX_SCORE) {
                state.status = 'gameover';
                state.winner = 'p2';
            } else {
                setupServe();
            }
            updateScoreUI();
        }

        function syncState(newState) {
            const oldStatus = state.status;
            state = newState;
            updateScoreUI();
            
            if (oldStatus !== state.status) {
                updateStatusUI();
            }
        }

        function updateScoreUI() {
            document.getElementById('scoreP1').textContent = String(state.score.p1).padStart(2, '0');
            document.getElementById('scoreP2').textContent = String(state.score.p2).padStart(2, '0');

            if (state.status === 'gameover') {
                const wText = document.getElementById('winnerText');
                if (state.winner === 'p1') {
                    wText.textContent = document.getElementById('p1DisplayName').textContent;
                    wText.className = "text-7xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-rose-600 mb-12 uppercase tracking-tighter filter drop-shadow-[0_0_20px_rgba(236,72,153,0.5)]";
                } else {
                    wText.textContent = document.getElementById('p2DisplayName').textContent;
                    wText.className = "text-7xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 mb-12 uppercase tracking-tighter filter drop-shadow-[0_0_20px_rgba(56,189,248,0.5)]";
                }
                gameOverPanel.classList.remove('hidden');
            } else {
                gameOverPanel.classList.add('hidden');
            }
        }

        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            
            if (camera.aspect < 1) {
                camera.fov = 75;
                camera.position.set(0, 18, 42); 
            } else {
                camera.fov = 45;
                camera.position.set(0, 16, 38);
            }
            
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderVisuals() {
            objects.p1.position.x += (state.p1.x - objects.p1.position.x) * 0.25;
            objects.p1.position.y += (state.p1.y - objects.p1.position.y) * 0.25;
            objects.p1.rotation.y = -objects.p1.position.x * 0.04; 
            objects.p1.rotation.z = objects.p1.position.x * 0.04;

            objects.p2.position.x += (state.p2.x - objects.p2.position.x) * 0.25;
            objects.p2.position.y += (state.p2.y - objects.p2.position.y) * 0.25;
            objects.p2.rotation.y = -objects.p2.position.x * 0.04;
            objects.p2.rotation.z = objects.p2.position.x * 0.04;

            objects.ball.position.x = state.ball.x;
            objects.ball.position.y = state.ball.y;
            objects.ball.position.z = state.ball.z;

            if (!isHost && !isAI) {
                if (camera.aspect < 1) {
                    camera.position.set(0, 18, -42);
                } else {
                    camera.position.set(0, 16, -38);
                }
                camera.lookAt(0, -2, 0);
            } else {
                if (camera.aspect < 1) {
                    camera.position.set(0, 18, 42);
                } else {
                    camera.position.set(0, 16, 38);
                }
                camera.lookAt(0, -2, 0);
            }
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            if (gameActive) {
                updatePhysics();
                
                if (isAI && state.status === 'serve' && state.server === 'p2') {
                    aiServeTimer++;
                    if (aiServeTimer > 60) {
                        executeServe();
                        aiServeTimer = 0;
                    }
                }
            }
            renderVisuals();
            
            renderer.render(scene, camera);
        }

        gameLoop();

    </script>
</body>
</html>

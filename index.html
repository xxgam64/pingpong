<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rally - 3D Table Tennis Multiplayer</title>
    
    <!-- Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js untuk grafis 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- PeerJS untuk koneksi Multiplayer (WebRTC) -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            touch-action: none;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        
        .interactive-ui {
            pointer-events: auto;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(226, 232, 240, 0.5);
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .status-dot {
            height: 10px; width: 10px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        input:focus {
            outline: none;
            border-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer" class="flex flex-col justify-between p-6 md:p-10">
        
        <div id="inGameHeader" class="hidden flex justify-between items-start w-full max-w-6xl mx-auto">
            <div class="flex items-center space-x-3 bg-white/70 backdrop-blur-md p-2 pr-5 rounded-full shadow-sm border border-slate-200">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-rose-500 to-red-600 shadow-md flex items-center justify-center text-white font-bold" id="p1Avatar">P1</div>
                <div>
                    <h2 id="p1NameLabel" class="font-bold text-sm md:text-base uppercase tracking-wider text-slate-800 leading-tight">HOST</h2>
                    <p class="text-[10px] text-slate-500 font-semibold uppercase tracking-widest" id="roomDisplay">Room: ----</p>
                </div>
            </div>
            
            <div class="flex flex-col items-center bg-white/70 backdrop-blur-md px-8 py-3 rounded-3xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold tracking-[0.2em] text-slate-400 mb-1">SCORE</p>
                <div class="flex items-baseline space-x-6">
                    <span id="scoreP1" class="text-5xl md:text-6xl font-black text-slate-800 tracking-tighter">00</span>
                    <span class="text-xl text-slate-300">-</span>
                    <span id="scoreP2" class="text-5xl md:text-6xl font-black text-slate-800 tracking-tighter">00</span>
                </div>
                <div id="gameStatusText" class="mt-3 px-4 py-1.5 bg-slate-800 rounded-full text-[10px] font-bold text-white shadow-md uppercase tracking-wider">
                    WAITING TO SERVE
                </div>
            </div>

            <div class="flex items-center space-x-3 text-right bg-white/70 backdrop-blur-md p-2 pl-5 rounded-full shadow-sm border border-slate-200">
                <div>
                    <h2 id="p2NameLabel" class="font-bold text-sm md:text-base uppercase tracking-wider text-slate-800 leading-tight">GUEST</h2>
                    <p class="text-[10px] text-slate-500 font-semibold flex items-center justify-end space-x-1.5 uppercase tracking-widest">
                        <span>Connected</span>
                        <span class="status-dot"></span>
                    </p>
                </div>
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-slate-700 to-slate-900 shadow-md flex items-center justify-center text-white font-bold" id="p2Avatar">P2</div>
            </div>
        </div>

        <div id="menuPanel" class="interactive-ui flex-1 flex items-center justify-center absolute inset-0">
            <div class="glass-panel p-8 md:p-12 rounded-[2rem] max-w-md w-full mx-4 relative overflow-hidden">
                <div class="absolute -top-16 -right-16 w-48 h-48 bg-rose-400 rounded-full opacity-20 blur-3xl"></div>
                <div class="absolute -bottom-16 -left-16 w-48 h-48 bg-indigo-400 rounded-full opacity-20 blur-3xl"></div>

                <div class="text-center mb-10 relative z-10">
                    <h1 class="text-5xl font-black tracking-tighter text-slate-900 mb-2">RALLY <span class="text-rose-500">3D</span></h1>
                    <p class="text-xs font-bold text-slate-400 tracking-[0.2em] uppercase">The Everyday Club</p>
                </div>

                <div id="alertBox" class="hidden mb-6 p-4 bg-rose-50 text-rose-600 rounded-xl border border-rose-100 text-sm font-bold text-center shadow-sm">
                    Alert Message Here
                </div>

                <div id="setupSection" class="space-y-6 relative z-10">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 pl-1">Player Name</label>
                        <input type="text" id="playerName" placeholder="Enter your name" class="w-full bg-slate-50/50 border-2 border-slate-200 rounded-2xl px-5 py-4 text-slate-800 font-bold transition-all focus:bg-white" maxlength="10">
                    </div>

                    <div class="pt-2 space-y-4">
                        <button onclick="hostGame()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg shadow-slate-900/20 transition-transform transform hover:scale-[1.02] active:scale-95 tracking-wide">
                            CREATE ROOM (HOST)
                        </button>
                        
                        <div class="relative flex items-center py-2">
                            <div class="flex-grow border-t border-slate-200"></div>
                            <span class="flex-shrink-0 mx-4 text-slate-400 text-[10px] font-bold uppercase tracking-widest">OR JOIN ROOM</span>
                            <div class="flex-grow border-t border-slate-200"></div>
                        </div>

                        <div class="flex space-x-3">
                            <input type="text" id="joinId" placeholder="Room ID" class="w-2/3 bg-slate-50/50 border-2 border-slate-200 rounded-2xl px-5 py-4 text-slate-800 font-mono text-sm transition-all focus:bg-white uppercase">
                            <button onclick="joinGame()" class="w-1/3 bg-rose-500 hover:bg-rose-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-rose-500/20 transition-transform transform hover:scale-[1.02] active:scale-95 tracking-wide">
                                JOIN
                            </button>
                        </div>
                    </div>
                </div>

                <div id="waitingSection" class="hidden text-center space-y-8 relative z-10 py-6">
                    <div>
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Your Room ID</p>
                        <div class="bg-slate-50 border-2 border-slate-200 p-5 rounded-2xl flex items-center justify-between">
                            <span id="displayRoomId" class="font-mono text-xl font-black text-slate-800 tracking-wider">Loading...</span>
                            <button onclick="copyId()" id="copyBtn" class="bg-white border-2 border-slate-200 shadow-sm px-4 py-2 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-50 transition-colors">
                                COPY
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center space-y-4">
                        <div class="w-10 h-10 border-4 border-slate-200 border-t-rose-500 rounded-full animate-spin"></div>
                        <p class="text-xs font-bold tracking-wider text-slate-500 uppercase">Waiting for opponent...</p>
                    </div>
                    <button onclick="cancelMatch()" class="text-[10px] font-bold text-slate-400 hover:text-rose-500 uppercase tracking-widest transition-colors">Cancel</button>
                </div>
            </div>
        </div>
        
        <div id="gameOverPanel" class="hidden interactive-ui flex-1 flex flex-col items-center justify-center absolute inset-0 bg-white/90 backdrop-blur-xl">
            <h2 class="text-7xl font-black text-slate-900 mb-3 uppercase tracking-tighter" id="winnerText">WINNER</h2>
            <p class="text-sm font-bold text-slate-500 mb-10 tracking-[0.3em]">WINS THE MATCH</p>
            <button onclick="restartMatch()" class="bg-rose-500 hover:bg-rose-600 text-white px-12 py-5 rounded-full font-black shadow-xl shadow-rose-500/30 transition-transform transform hover:scale-105 tracking-wide">
                PLAY AGAIN
            </button>
        </div>
        
        <div class="absolute bottom-6 left-0 w-full text-center pointer-events-none">
            <p class="text-[10px] font-bold text-slate-400 tracking-[0.2em] uppercase bg-white/50 backdrop-blur-sm inline-block px-4 py-2 rounded-full">MOVE MOUSE TO PLAY • CLICK TO SERVE</p>
        </div>
    </div>

    <script>
        const menuPanel = document.getElementById('menuPanel');
        const setupSection = document.getElementById('setupSection');
        const waitingSection = document.getElementById('waitingSection');
        const inGameHeader = document.getElementById('inGameHeader');
        const gameOverPanel = document.getElementById('gameOverPanel');
        const alertBox = document.getElementById('alertBox');
        
        let isHost = false;
        let myName = localStorage.getItem('rally_name') || 'Player';
        document.getElementById('playerName').value = myName;
        
        let peer = null;
        let conn = null;
        let gameActive = false;
        let rallyCount = 0;

        let state = {
            status: 'menu', 
            score: { p1: 0, p2: 0 },
            server: 'p1', 
            ball: { x: 0, y: 1.5, z: 0, vx: 0, vy: 0, vz: 0 },
            p1: { x: 0, y: 1 }, 
            p2: { x: 0, y: 1 }, 
            winner: null
        };

        const MAX_SCORE = 11;
        const TABLE_WIDTH = 15;
        const TABLE_LENGTH = 27;
        const TABLE_HEIGHT = 7.6; 
        
        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 3000);
        }

        function initNetwork(callback) {
            if (peer) peer.destroy();
            peer = new Peer(null, { debug: 2 });
            
            peer.on('open', (id) => {
                callback(id);
            });
            peer.on('error', (err) => {
                showAlert("Network Error: " + err.type);
                cancelMatch();
            });
        }

        function hostGame() {
            myName = document.getElementById('playerName').value.trim() || 'Host';
            localStorage.setItem('rally_name', myName);
            isHost = true;
            
            setupSection.classList.add('hidden');
            waitingSection.classList.remove('hidden');
            
            initNetwork((id) => {
                document.getElementById('displayRoomId').textContent = id;
                
                peer.on('connection', (connection) => {
                    if (conn) { connection.close(); return; }
                    conn = connection;
                    setupConnection();
                });
            });
        }

        function joinGame() {
            const hostId = document.getElementById('joinId').value.trim();
            if (!hostId) { showAlert("Please enter Room ID"); return; }
            
            myName = document.getElementById('playerName').value.trim() || 'Guest';
            localStorage.setItem('rally_name', myName);
            isHost = false;
            
            setupSection.classList.add('hidden');
            
            initNetwork((id) => {
                conn = peer.connect(hostId, { reliable: true });
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                conn.send({ type: 'init', name: myName });
                startGameUI();
            });

            conn.on('data', (data) => {
                if (isHost) {
                    if (data.type === 'init') {
                        document.getElementById('p2NameLabel').textContent = data.name;
                        document.getElementById('p2Avatar').textContent = data.name.charAt(0).toUpperCase();
                        resetGame(); 
                    }
                    if (data.type === 'paddleUpdate') {
                        state.p2.x = data.x;
                        state.p2.y = data.y;
                    }
                    if (data.type === 'serveRequest' && state.status === 'serve' && state.server === 'p2') {
                        executeServe();
                    }
                } else {
                    if (data.type === 'init') {
                        document.getElementById('p1NameLabel').textContent = data.name;
                        document.getElementById('p1Avatar').textContent = data.name.charAt(0).toUpperCase();
                    }
                    if (data.type === 'stateUpdate') {
                        syncState(data.state);
                    }
                }
            });

            conn.on('close', () => {
                showAlert("Opponent disconnected.");
                cancelMatch();
            });
        }

        function copyId() {
            const id = document.getElementById('displayRoomId').textContent;
            navigator.clipboard.writeText(id).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = 'COPIED';
                setTimeout(() => btn.textContent = 'COPY', 2000);
            });
        }

        function cancelMatch() {
            if (conn) conn.close();
            if (peer) peer.destroy();
            setupSection.classList.remove('hidden');
            waitingSection.classList.add('hidden');
            menuPanel.classList.remove('hidden');
            inGameHeader.classList.add('hidden');
            gameOverPanel.classList.add('hidden');
            gameActive = false;
        }

        function startGameUI() {
            menuPanel.classList.add('hidden');
            inGameHeader.classList.remove('hidden');
            
            if (isHost) {
                document.getElementById('p1NameLabel').textContent = myName;
                document.getElementById('p1Avatar').textContent = myName.charAt(0).toUpperCase();
                document.getElementById('roomDisplay').textContent = "Room: " + peer.id;
            } else {
                document.getElementById('p2NameLabel').textContent = myName;
                document.getElementById('p2Avatar').textContent = myName.charAt(0).toUpperCase();
                document.getElementById('roomDisplay').textContent = "Connected";
            }
            
            gameActive = true;
            resizeCanvas(); 
        }

        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#f8fafc'); 
        scene.fog = new THREE.Fog('#f8fafc', 25, 70); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 32); 
        camera.lookAt(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(12, 35, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        const objects = {};

        const floorGeo = new THREE.PlaneGeometry(120, 120);
        const floorMat = new THREE.ShadowMaterial({ opacity: 0.08 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -TABLE_HEIGHT; 
        floor.receiveShadow = true;
        scene.add(floor);

        const tableGroup = new THREE.Group();
        
        const tableTopGeo = new THREE.BoxGeometry(TABLE_WIDTH, 0.6, TABLE_LENGTH);
        const tableTopMat = new THREE.MeshStandardMaterial({ 
            color: '#14532d', 
            roughness: 0.25,
            metalness: 0.15
        });
        const tableTop = new THREE.Mesh(tableTopGeo, tableTopMat);
        tableTop.receiveShadow = true;
        tableTop.castShadow = true;
        tableGroup.add(tableTop);

        const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
        const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.12, TABLE_LENGTH), lineMat);
        centerLine.rotation.x = -Math.PI / 2;
        centerLine.position.y = 0.31; 
        tableGroup.add(centerLine);

        const borderGeo = new THREE.BoxGeometry(TABLE_WIDTH + 0.5, 0.7, TABLE_LENGTH + 0.5);
        const borderMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
        const tableBorder = new THREE.Mesh(borderGeo, borderMat);
        tableBorder.position.y = -0.05;
        tableGroup.add(tableBorder);

        const netGeo = new THREE.PlaneGeometry(TABLE_WIDTH + 1.5, 1.4);
        const netMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            transparent: true, 
            opacity: 0.35, 
            side: THREE.DoubleSide,
            wireframe: true 
        });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.y = 1.0;
        tableGroup.add(net);

        scene.add(tableGroup);

        function createPaddle(colorHex) {
            const group = new THREE.Group();
            
            const padGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.35, 32);
            const padMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.6, metalness: 0.1 });
            const pad = new THREE.Mesh(padGeo, padMat);
            pad.rotation.x = Math.PI / 2; 
            pad.castShadow = true;
            group.add(pad);

            const handleGeo = new THREE.BoxGeometry(0.7, 2.2, 0.45);
            const handleMat = new THREE.MeshStandardMaterial({ color: '#b45309', roughness: 0.8 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -2.1;
            handle.castShadow = true;
            group.add(handle);

            return group;
        }

        objects.p1 = createPaddle('#e11d48'); 
        objects.p1.position.z = TABLE_LENGTH / 2 + 1;
        scene.add(objects.p1);

        objects.p2 = createPaddle('#0f172a'); 
        objects.p2.position.z = -(TABLE_LENGTH / 2) - 1;
        scene.add(objects.p2);

        const ballGeo = new THREE.SphereGeometry(0.35, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: '#f97316', roughness: 0.2, metalness: 0.3 });
        objects.ball = new THREE.Mesh(ballGeo, ballMat);
        objects.ball.castShadow = true;
        scene.add(objects.ball);

        function updateMousePos(e) {
            if (!gameActive) return;
            
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const targetX = ((clientX / window.innerWidth) * 2 - 1) * 10.5;
            const targetY = (-(clientY / window.innerHeight) * 2 + 1) * 4.5 + 3.5;

            if (isHost) {
                state.p1.x = targetX;
                state.p1.y = targetY;
            } else {
                state.p2.x = -targetX; 
                state.p2.y = targetY;
                if (conn && conn.open) {
                    conn.send({ type: 'paddleUpdate', x: state.p2.x, y: state.p2.y });
                }
            }
        }

        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('touchmove', updateMousePos, {passive: false});
        
        window.addEventListener('pointerdown', () => {
            if (!gameActive || state.status !== 'serve') return;
            
            if (isHost && state.server === 'p1') {
                executeServe();
            } else if (!isHost && state.server === 'p2') {
                if (conn && conn.open) conn.send({ type: 'serveRequest' });
            }
        });

        const GRAVITY = 0.012;

        function resetGame() {
            state.score = { p1: 0, p2: 0 };
            state.server = 'p1';
            state.winner = null;
            gameOverPanel.classList.add('hidden');
            setupServe();
        }

        function restartMatch() {
            if (isHost) {
                resetGame();
            } else {
                showAlert("Waiting for Host to restart...");
            }
        }

        function setupServe() {
            state.status = 'serve';
            state.ball.vx = 0;
            state.ball.vy = 0;
            state.ball.vz = 0;
            rallyCount = 0;
            
            state.ball.x = 0;
            state.ball.y = 2.5;
            state.ball.z = state.server === 'p1' ? (TABLE_LENGTH / 2 - 2) : -(TABLE_LENGTH / 2 - 2);
            
            updateStatusUI();
        }

        function executeServe() {
            state.status = 'rally';
            state.ball.vy = 0.25; 
            state.ball.vz = state.server === 'p1' ? -0.3 : 0.3;
            state.ball.vx = (Math.random() - 0.5) * 0.15; 
            
            updateStatusUI();
        }

        function updateStatusUI() {
            const statusEl = document.getElementById('gameStatusText');
            if (state.status === 'serve') {
                statusEl.textContent = state.server === (isHost ? 'p1' : 'p2') ? "YOUR TURN TO SERVE" : "WAITING FOR OPPONENT";
                statusEl.classList.replace('bg-emerald-500', 'bg-slate-800');
            } else if (state.status === 'rally') {
                statusEl.textContent = `RALLY: ${rallyCount}`;
                statusEl.classList.replace('bg-slate-800', 'bg-emerald-500');
            }
        }

        function updatePhysics() {
            if (!isHost || state.status !== 'rally') return;

            const b = state.ball;
            b.x += b.vx;
            b.y += b.vy;
            b.z += b.vz;

            b.vy -= GRAVITY; 

            if (b.y <= 0.65 && b.z > -TABLE_LENGTH/2 && b.z < TABLE_LENGTH/2 && b.x > -TABLE_WIDTH/2 && b.x < TABLE_WIDTH/2) {
                if (b.vy < 0) {
                    b.vy = Math.abs(b.vy) * 0.82; 
                    b.y = 0.65;
                }
            }

            if (Math.abs(b.z) < 0.6 && b.y < 2.2 && b.x > -TABLE_WIDTH/2 -1 && b.x < TABLE_WIDTH/2 + 1) {
                b.vz = -b.vz * 0.4; 
            }

            const speedIncrement = rallyCount * 0.008;

            if (b.z > TABLE_LENGTH/2 && b.z < TABLE_LENGTH/2 + 1.8 && b.vz > 0) {
                const dx = b.x - state.p1.x;
                const dy = b.y - state.p1.y;
                if (Math.sqrt(dx*dx + dy*dy) < 2.6) { 
                    b.vz = -(0.35 + speedIncrement); 
                    b.vy = 0.3 + (state.p1.y - b.y) * 0.08; 
                    b.vx = -dx * 0.12; 
                    rallyCount++;
                    updateStatusUI();
                }
            }

            if (b.z < -TABLE_LENGTH/2 && b.z > -TABLE_LENGTH/2 - 1.8 && b.vz < 0) {
                const dx = b.x - state.p2.x;
                const dy = b.y - state.p2.y;
                if (Math.sqrt(dx*dx + dy*dy) < 2.6) {
                    b.vz = 0.35 + speedIncrement;
                    b.vy = 0.3 + (state.p2.y - b.y) * 0.08;
                    b.vx = -dx * 0.12;
                    rallyCount++;
                    updateStatusUI();
                }
            }

            if (b.y < -4) {
                if (b.z > 0) {
                    state.score.p2++;
                    state.server = 'p2'; 
                } else {
                    state.score.p1++;
                    state.server = 'p1';
                }
                
                checkWinCondition();
            }

            if (conn && conn.open) {
                conn.send({ type: 'stateUpdate', state: state });
            }
        }

        function checkWinCondition() {
            if (state.score.p1 >= MAX_SCORE) {
                state.status = 'gameover';
                state.winner = 'p1';
            } else if (state.score.p2 >= MAX_SCORE) {
                state.status = 'gameover';
                state.winner = 'p2';
            } else {
                setupServe();
            }
            updateScoreUI();
        }

        function syncState(newState) {
            const oldStatus = state.status;
            state = newState;
            updateScoreUI();
            
            if (oldStatus !== state.status) {
                updateStatusUI();
            }
        }

        function updateScoreUI() {
            document.getElementById('scoreP1').textContent = String(state.score.p1).padStart(2, '0');
            document.getElementById('scoreP2').textContent = String(state.score.p2).padStart(2, '0');

            if (state.status === 'gameover') {
                const wText = document.getElementById('winnerText');
                if (state.winner === 'p1') {
                    wText.textContent = document.getElementById('p1NameLabel').textContent;
                    wText.className = "text-7xl font-black text-rose-500 mb-3 uppercase tracking-tighter";
                } else {
                    wText.textContent = document.getElementById('p2NameLabel').textContent;
                    wText.className = "text-7xl font-black text-slate-800 mb-3 uppercase tracking-tighter";
                }
                gameOverPanel.classList.remove('hidden');
            } else {
                gameOverPanel.classList.add('hidden');
            }
        }


        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderVisuals() {
            objects.p1.position.x += (state.p1.x - objects.p1.position.x) * 0.25;
            objects.p1.position.y += (state.p1.y - objects.p1.position.y) * 0.25;
            
            objects.p1.rotation.y = -objects.p1.position.x * 0.04; 
            objects.p1.rotation.z = objects.p1.position.x * 0.04;

            objects.p2.position.x += (state.p2.x - objects.p2.position.x) * 0.25;
            objects.p2.position.y += (state.p2.y - objects.p2.position.y) * 0.25;
            
            objects.p2.rotation.y = -objects.p2.position.x * 0.04;
            objects.p2.rotation.z = objects.p2.position.x * 0.04;

            objects.ball.position.x = state.ball.x;
            objects.ball.position.y = state.ball.y;
            objects.ball.position.z = state.ball.z;

            if (!isHost) {
                camera.position.set(0, 16, -32);
                camera.lookAt(0, 0, 0);
            } else {
                camera.position.set(0, 16, 32);
                camera.lookAt(0, 0, 0);
            }
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            if (gameActive) {
                updatePhysics();
            }
            renderVisuals();
            
            renderer.render(scene, camera);
        }

        gameLoop();

    </script>
</body>
</html>

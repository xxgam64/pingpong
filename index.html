<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XXPONG - Professional 3D Table Tennis</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: none;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        
        .interactive-ui {
            pointer-events: auto;
        }

        /* Menu Panel Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        /* Top Scoreboard Styling - Flush to top */
        .scoreboard-bar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 0 0 24px 24px;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .status-dot {
            height: 10px; width: 10px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        input {
            background-color: rgba(30, 41, 59, 0.8) !important;
            color: white !important;
            border-color: #334155 !important;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer" class="flex flex-col justify-between">
        
        <!-- Scoreboard - Flush Top Bar -->
        <div id="inGameHeader" class="hidden interactive-ui pointer-events-none w-full">
            <div class="scoreboard-bar w-full max-w-5xl mx-auto flex justify-between items-center py-2 px-4 md:px-8">
                
                <!-- P1 Info (Left) -->
                <div class="flex items-center space-x-3 w-1/3">
                    <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-gradient-to-br from-pink-500 to-rose-600 shadow-md flex items-center justify-center text-white font-black text-sm md:text-lg border-2 border-slate-800" id="p1Avatar">P1</div>
                    <div class="flex flex-col">
                        <span class="text-[8px] md:text-[10px] text-pink-400 font-bold uppercase tracking-widest leading-none mb-0.5" id="roomDisplay">HOST</span>
                        <h2 id="p1NameLabel" class="font-bold text-sm md:text-base uppercase tracking-wider text-slate-100 leading-none truncate max-w-[100px] md:max-w-[150px]">PLAYER 1</h2>
                    </div>
                </div>
                
                <!-- Center Score -->
                <div class="flex flex-col items-center justify-center w-1/3">
                    <p class="text-[8px] md:text-[9px] font-bold tracking-[0.4em] text-slate-500 uppercase mb-1 hidden md:block">CHAMPIONSHIP</p>
                    <div class="flex items-center space-x-4 md:space-x-6 bg-slate-900/50 px-4 md:px-6 py-1 md:py-2 rounded-2xl border border-slate-700/50">
                        <span id="scoreP1" class="text-3xl md:text-5xl font-black text-pink-500 tracking-tighter w-12 md:w-16 text-right">00</span>
                        <span class="text-lg md:text-xl text-slate-600 font-black">-</span>
                        <span id="scoreP2" class="text-3xl md:text-5xl font-black text-cyan-500 tracking-tighter w-12 md:w-16 text-left">00</span>
                    </div>
                    <div id="gameStatusText" class="mt-1 md:mt-2 text-[8px] md:text-[10px] font-bold text-slate-300 uppercase tracking-widest">
                        WAITING
                    </div>
                </div>

                <!-- P2 Info (Right) -->
                <div class="flex items-center justify-end space-x-3 w-1/3 text-right">
                    <div class="flex flex-col items-end">
                        <div class="flex items-center space-x-2 leading-none mb-0.5">
                            <span id="connectionStatus" class="text-[8px] md:text-[10px] text-cyan-400 font-bold uppercase tracking-widest">GUEST</span>
                            <span class="status-dot" id="statusDot"></span>
                        </div>
                        <h2 id="p2NameLabel" class="font-bold text-sm md:text-base uppercase tracking-wider text-slate-100 leading-none truncate max-w-[100px] md:max-w-[150px]">PLAYER 2</h2>
                    </div>
                    <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 shadow-md flex items-center justify-center text-white font-black text-sm md:text-lg border-2 border-slate-800" id="p2Avatar">P2</div>
                </div>

            </div>
        </div>

        <!-- Main Menu -->
        <div id="menuPanel" class="interactive-ui flex-1 flex items-center justify-center absolute inset-0">
            <div class="glass-panel p-8 md:p-12 rounded-[2rem] max-w-md w-full mx-4 relative overflow-hidden">
                <div class="absolute -top-20 -right-20 w-64 h-64 bg-pink-500 rounded-full opacity-20 blur-[80px]"></div>
                <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-cyan-500 rounded-full opacity-20 blur-[80px]"></div>

                <div class="text-center mb-8 relative z-10">
                    <h1 class="text-5xl md:text-6xl font-black tracking-tighter text-white mb-2">XX<span class="text-pink-500">PONG</span></h1>
                    <p class="text-[10px] md:text-xs font-bold text-cyan-400 tracking-[0.3em] uppercase">Multiplayer Arena</p>
                </div>

                <div id="alertBox" class="hidden mb-4 p-3 bg-red-900/50 text-red-200 rounded-xl border border-red-700/50 text-xs md:text-sm font-bold text-center shadow-sm backdrop-blur-sm">
                    Alert Message
                </div>

                <div id="setupSection" class="space-y-5 relative z-10">
                    <div>
                        <label class="block text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 pl-2">Player Name</label>
                        <input type="text" id="playerName" placeholder="Enter name" class="w-full rounded-2xl px-5 py-3 md:py-4 text-white font-bold transition-all text-base md:text-lg uppercase" maxlength="10">
                    </div>

                    <div class="pt-2 space-y-3">
                        <button onclick="playAI()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-black py-3 md:py-4 rounded-2xl shadow-lg transition-transform transform hover:scale-[1.02] active:scale-95 tracking-widest text-xs md:text-sm">
                            PLAY VS AI
                        </button>

                        <button onclick="hostGame()" class="w-full bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-400 hover:to-rose-500 text-white font-black py-3 md:py-4 rounded-2xl shadow-lg shadow-pink-500/30 transition-transform transform hover:scale-[1.02] active:scale-95 tracking-widest text-xs md:text-sm">
                            HOST GAME ONLINE
                        </button>
                        
                        <div class="relative flex items-center py-1 md:py-2">
                            <div class="flex-grow border-t border-slate-700"></div>
                            <span class="flex-shrink-0 mx-4 text-slate-500 text-[9px] md:text-[10px] font-bold uppercase tracking-widest">OR JOIN</span>
                            <div class="flex-grow border-t border-slate-700"></div>
                        </div>

                        <div class="flex space-x-2 md:space-x-3">
                            <input type="text" id="joinId" placeholder="Room ID" class="w-2/3 rounded-2xl px-4 py-3 md:py-4 font-mono text-xs md:text-sm transition-all uppercase">
                            <button onclick="joinGame()" class="w-1/3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black py-3 md:py-4 rounded-2xl shadow-lg shadow-cyan-500/30 transition-transform transform hover:scale-[1.02] active:scale-95 tracking-widest text-xs md:text-sm">
                                JOIN
                            </button>
                        </div>
                    </div>
                </div>

                <div id="waitingSection" class="hidden text-center space-y-8 relative z-10 py-6">
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Share this Room ID</p>
                        <div class="bg-slate-800/80 border border-slate-600 p-5 rounded-2xl flex items-center justify-between">
                            <span id="displayRoomId" class="font-mono text-base md:text-lg font-black text-pink-400 tracking-wider">Loading...</span>
                            <button onclick="copyId()" id="copyBtn" class="bg-slate-700 hover:bg-slate-600 px-3 md:px-4 py-2 rounded-xl text-[10px] md:text-xs font-bold text-white transition-colors">
                                COPY
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center space-y-4">
                        <div class="w-10 h-10 md:w-12 md:h-12 border-4 border-slate-700 border-t-pink-500 rounded-full animate-spin"></div>
                        <p class="text-[10px] md:text-xs font-bold tracking-widest text-cyan-400 uppercase animate-pulse">Waiting for opponent</p>
                    </div>
                    <button onclick="cancelMatch()" class="text-[9px] md:text-[10px] font-bold text-slate-500 hover:text-white uppercase tracking-widest transition-colors">Cancel</button>
                </div>
            </div>
        </div>
        
        <!-- Game Over Panel -->
        <div id="gameOverPanel" class="hidden interactive-ui flex-1 flex flex-col items-center justify-center absolute inset-0 bg-slate-900/90 backdrop-blur-xl z-20">
            <p class="text-xs md:text-sm font-bold text-cyan-400 mb-2 md:mb-4 tracking-[0.4em] uppercase text-center">Match Concluded</p>
            <h2 class="text-5xl md:text-7xl font-black text-white mb-8 md:mb-12 uppercase tracking-tighter text-center px-4" id="winnerText">WINNER</h2>
            <button onclick="restartMatch()" class="bg-gradient-to-r from-pink-500 to-rose-600 text-white px-10 md:px-12 py-4 md:py-5 rounded-full font-black shadow-xl shadow-pink-500/30 transition-transform transform hover:scale-105 tracking-widest text-sm md:text-lg">
                REMATCH
            </button>
        </div>
        
        <div class="absolute bottom-6 md:bottom-8 left-0 w-full text-center pointer-events-none z-10">
            <p id="instructionText" class="text-[9px] md:text-xs font-bold text-slate-400 tracking-[0.2em] uppercase bg-slate-900/60 backdrop-blur-md border border-slate-700/50 inline-block px-4 md:px-6 py-2 md:py-3 rounded-full shadow-lg">TOUCH / MOUSE TO PLAY • TAP TO SERVE</p>
        </div>
    </div>

    <script>
        const menuPanel = document.getElementById('menuPanel');
        const setupSection = document.getElementById('setupSection');
        const waitingSection = document.getElementById('waitingSection');
        const inGameHeader = document.getElementById('inGameHeader');
        const gameOverPanel = document.getElementById('gameOverPanel');
        const alertBox = document.getElementById('alertBox');
        const instructionText = document.getElementById('instructionText');
        
        let isHost = false;
        let isAI = false;
        let myName = localStorage.getItem('rally_name') || 'PLAYER';
        document.getElementById('playerName').value = myName;
        
        let peer = null;
        let conn = null;
        let gameActive = false;
        let rallyCount = 0;
        let aiServeTimer = 0;

        let state = {
            status: 'menu', 
            score: { p1: 0, p2: 0 },
            server: 'p1', 
            ball: { x: 0, y: 1.5, z: 0, vx: 0, vy: 0, vz: 0 },
            p1: { x: 0, y: 1 }, 
            p2: { x: 0, y: 1 }, 
            winner: null,
            lastHit: null,
            tableHit: null
        };

        const MAX_SCORE = 11;
        const TABLE_WIDTH = 15;
        const TABLE_LENGTH = 27;
        const TABLE_HEIGHT = 7.6; 
        
        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 3000);
        }

        function initNetwork(callback) {
            if (peer) peer.destroy();
            peer = new Peer(null, { debug: 2 });
            
            peer.on('open', (id) => {
                callback(id);
            });
            peer.on('error', (err) => {
                showAlert("Network Error: " + err.type);
                cancelMatch();
            });
        }

        function playAI() {
            myName = document.getElementById('playerName').value.trim().toUpperCase() || 'PLAYER';
            localStorage.setItem('rally_name', myName);
            isHost = true;
            isAI = true;
            
            setupSection.classList.add('hidden');
            startGameUI();
            resetGame();
        }

        function hostGame() {
            myName = document.getElementById('playerName').value.trim().toUpperCase() || 'HOST';
            localStorage.setItem('rally_name', myName);
            isHost = true;
            isAI = false;
            
            setupSection.classList.add('hidden');
            waitingSection.classList.remove('hidden');
            
            initNetwork((id) => {
                document.getElementById('displayRoomId').textContent = id;
                
                peer.on('connection', (connection) => {
                    if (conn) { connection.close(); return; }
                    conn = connection;
                    setupConnection();
                });
            });
        }

        function joinGame() {
            const hostId = document.getElementById('joinId').value.trim();
            if (!hostId) { showAlert("Please enter Room ID"); return; }
            
            myName = document.getElementById('playerName').value.trim().toUpperCase() || 'GUEST';
            localStorage.setItem('rally_name', myName);
            isHost = false;
            isAI = false;
            
            setupSection.classList.add('hidden');
            
            initNetwork((id) => {
                conn = peer.connect(hostId, { reliable: true });
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                conn.send({ type: 'init', name: myName });
                startGameUI();
            });

            conn.on('data', (data) => {
                if (isHost) {
                    if (data.type === 'init') {
                        document.getElementById('p2NameLabel').textContent = data.name;
                        document.getElementById('p2Avatar').textContent = data.name.substring(0, 2);
                        resetGame(); 
                    }
                    if (data.type === 'paddleUpdate') {
                        state.p2.x = data.x;
                        state.p2.y = data.y;
                    }
                    if (data.type === 'serveRequest' && state.status === 'serve' && state.server === 'p2') {
                        executeServe();
                    }
                } else {
                    if (data.type === 'init') {
                        document.getElementById('p1NameLabel').textContent = data.name;
                        document.getElementById('p1Avatar').textContent = data.name.substring(0, 2);
                    }
                    if (data.type === 'stateUpdate') {
                        syncState(data.state);
                    }
                }
            });

            conn.on('close', () => {
                showAlert("Opponent disconnected.");
                cancelMatch();
            });
        }

        function copyId() {
            const id = document.getElementById('displayRoomId').textContent;
            navigator.clipboard.writeText(id).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = 'COPIED';
                setTimeout(() => btn.textContent = 'COPY', 2000);
            });
        }

        function cancelMatch() {
            if (conn) conn.close();
            if (peer) peer.destroy();
            setupSection.classList.remove('hidden');
            waitingSection.classList.add('hidden');
            menuPanel.classList.remove('hidden');
            inGameHeader.classList.add('hidden');
            gameOverPanel.classList.add('hidden');
            instructionText.classList.remove('hidden');
            gameActive = false;
            isAI = false;
        }

        function startGameUI() {
            menuPanel.classList.add('hidden');
            inGameHeader.classList.remove('hidden');
            instructionText.classList.add('hidden');
            
            document.getElementById('p1NameLabel').textContent = myName;
            document.getElementById('p1Avatar').textContent = myName.substring(0, 2);

            if (isAI) {
                document.getElementById('roomDisplay').textContent = "OFFLINE";
                document.getElementById('p2NameLabel').textContent = "BOT AI";
                document.getElementById('p2Avatar').textContent = "AI";
                document.getElementById('connectionStatus').textContent = "READY";
                document.getElementById('statusDot').style.backgroundColor = "#8b5cf6";
            } else if (isHost) {
                document.getElementById('roomDisplay').textContent = "ID: " + peer.id;
            } else {
                document.getElementById('p2NameLabel').textContent = myName;
                document.getElementById('p2Avatar').textContent = myName.substring(0, 2);
                document.getElementById('connectionStatus').textContent = "ONLINE";
            }
            
            gameActive = true;
            resizeCanvas(); 
        }

        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // FIX: Ensure correct color encoding so colors pop! No Tone Mapping!
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.NoToneMapping; 

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); // slate-900 background
        scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 38); 
        camera.lookAt(0, -2, 0);

        // Lighting - Adjusted for crisp colors without washing out the blue
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(15, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0xffffff, 0.2, 50);
        fillLight.position.set(-15, 10, -15);
        scene.add(fillLight);

        const objects = {};

        // Floor - Dark Slate Matte
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x1e293b,
            roughness: 0.9,
            metalness: 0.0
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -TABLE_HEIGHT; 
        floor.receiveShadow = true;
        scene.add(floor);

        // Table Group
        const tableGroup = new THREE.Group();
        
        // Table Top - Solid Tournament Blue (Using BasicMaterial so it doesn't fade)
        const tableTopGeo = new THREE.BoxGeometry(TABLE_WIDTH, 0.5, TABLE_LENGTH);
        const tableTopMat = new THREE.MeshBasicMaterial({ 
            color: 0x1e40af, // blue-800 - vibrant!
        });
        const tableTop = new THREE.Mesh(tableTopGeo, tableTopMat);
        // BasicMaterial doesn't receive shadows well, so we add a transparent shadow plane over it
        const tableShadowPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(TABLE_WIDTH, TABLE_LENGTH),
            new THREE.ShadowMaterial({ opacity: 0.3 })
        );
        tableShadowPlane.rotation.x = -Math.PI/2;
        tableShadowPlane.position.y = 0.26;
        tableShadowPlane.receiveShadow = true;
        tableGroup.add(tableShadowPlane);
        tableGroup.add(tableTop);

        // Table Lines
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.15, TABLE_LENGTH), lineMat);
        centerLine.rotation.x = -Math.PI / 2;
        centerLine.position.y = 0.26; 
        tableGroup.add(centerLine);

        const borderGeo = new THREE.BoxGeometry(TABLE_WIDTH + 0.3, 0.51, TABLE_LENGTH + 0.3);
        const borderMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const tableBorder = new THREE.Mesh(borderGeo, borderMat);
        tableBorder.position.y = 0;
        tableGroup.add(tableBorder);

        // Table Base / Skirt
        const baseGeo = new THREE.BoxGeometry(TABLE_WIDTH - 2, TABLE_HEIGHT, TABLE_LENGTH - 6);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
        const tableBase = new THREE.Mesh(baseGeo, baseMat);
        tableBase.position.y = -TABLE_HEIGHT / 2;
        tableBase.castShadow = true;
        tableGroup.add(tableBase);

        // Net Poles
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.5, roughness: 0.5 });
        const pole1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.8, 16), poleMat);
        pole1.position.set(TABLE_WIDTH/2 + 0.3, 0.9, 0);
        pole1.castShadow = true;
        tableGroup.add(pole1);

        const pole2 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.8, 16), poleMat);
        pole2.position.set(-TABLE_WIDTH/2 - 0.3, 0.9, 0);
        pole2.castShadow = true;
        tableGroup.add(pole2);

        // Net
        function createNetTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 128;
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, 512, 128);
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<=512; i+=10) { ctx.moveTo(i, 0); ctx.lineTo(i, 128); }
            for(let j=0; j<=128; j+=10) { ctx.moveTo(0, j); ctx.lineTo(512, j); }
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 512, 16); 
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 1);
            return tex;
        }

        const netGeo = new THREE.PlaneGeometry(TABLE_WIDTH + 0.6, 1.2);
        const netMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,
            map: createNetTexture(),
            transparent: true, 
            opacity: 0.7, 
            side: THREE.DoubleSide,
            alphaTest: 0.1
        });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.y = 0.85;
        tableGroup.add(net);

        scene.add(tableGroup);

        // Paddles
        function createPaddle(padColorHex) {
            const group = new THREE.Group();
            
            const padGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.25, 32);
            const padMat = new THREE.MeshStandardMaterial({ 
                color: padColorHex, 
                roughness: 0.5, 
            });
            const pad = new THREE.Mesh(padGeo, padMat);
            pad.rotation.x = Math.PI / 2; 
            pad.castShadow = true;
            group.add(pad);

            const handleGeo = new THREE.BoxGeometry(0.5, 2.0, 0.35);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0xca8a04, roughness: 0.8 }); // Wood color
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -1.9;
            handle.castShadow = true;
            group.add(handle);

            return group;
        }

        objects.p1 = createPaddle(0xf43f5e); // Rose-500
        objects.p1.position.z = TABLE_LENGTH / 2 + 1;
        scene.add(objects.p1);

        objects.p2 = createPaddle(0x06b6d4); // Cyan-500
        if(isAI) objects.p2.children[0].material.color.setHex(0x8b5cf6); // Purple for AI
        objects.p2.position.z = -(TABLE_LENGTH / 2) - 1;
        scene.add(objects.p2);

        // Ball - Bright Yellow Basic Material
        const ballGeo = new THREE.SphereGeometry(0.35, 32, 32);
        const ballMat = new THREE.MeshBasicMaterial({ 
            color: 0xfde047, // yellow-300
        });
        objects.ball = new THREE.Mesh(ballGeo, ballMat);
        // Cast shadow via hidden standard material sphere
        const ballShadowCaster = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({visible: false}));
        ballShadowCaster.castShadow = true;
        objects.ball.add(ballShadowCaster);
        scene.add(objects.ball);

        function updateMousePos(e) {
            if (!gameActive) return;
            
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const aspectMultiplier = camera.aspect < 1 ? 0.7 : 1; 
            const targetX = ((clientX / window.innerWidth) * 2 - 1) * 11 * aspectMultiplier;
            const targetY = (-(clientY / window.innerHeight) * 2 + 1) * 5 + 4;

            if (isHost) {
                state.p1.x = targetX;
                state.p1.y = targetY;
            } else {
                state.p2.x = -targetX; 
                state.p2.y = targetY;
                if (conn && conn.open && !isAI) {
                    conn.send({ type: 'paddleUpdate', x: state.p2.x, y: state.p2.y });
                }
            }
        }

        window.addEventListener('pointermove', updateMousePos, {passive: false});
        
        window.addEventListener('pointerdown', () => {
            if (!gameActive || state.status !== 'serve') return;
            
            if (isHost && state.server === 'p1') {
                executeServe();
            } else if (!isHost && state.server === 'p2') {
                if (conn && conn.open && !isAI) conn.send({ type: 'serveRequest' });
            }
        });

        const GRAVITY = 0.012;

        function resetGame() {
            state.score = { p1: 0, p2: 0 };
            state.server = 'p1';
            state.winner = null;
            if(isAI) objects.p2.children[0].material.color.setHex(0x8b5cf6); 
            gameOverPanel.classList.add('hidden');
            setupServe();
        }

        function restartMatch() {
            if (isHost || isAI) {
                resetGame();
            } else {
                showAlert("Waiting for Host to restart...");
            }
        }

        function setupServe() {
            state.status = 'serve';
            state.ball.vx = 0;
            state.ball.vy = 0;
            state.ball.vz = 0;
            rallyCount = 0;
            aiServeTimer = 0;
            state.lastHit = null;
            state.tableHit = null;
            
            state.ball.x = 0;
            state.ball.y = 2.5;
            state.ball.z = state.server === 'p1' ? (TABLE_LENGTH / 2 - 2) : -(TABLE_LENGTH / 2 - 2);
            
            updateStatusUI();
        }

        function executeServe() {
            state.status = 'rally';
            state.ball.vy = 0.25; 
            state.ball.vz = state.server === 'p1' ? -0.3 : 0.3;
            state.ball.vx = (Math.random() - 0.5) * 0.15; 
            state.lastHit = state.server;
            state.tableHit = null;
            
            updateStatusUI();
        }

        function updateStatusUI() {
            const statusEl = document.getElementById('gameStatusText');
            if (state.status === 'serve') {
                statusEl.textContent = state.server === (isHost ? 'p1' : 'p2') ? "YOUR TURN TO SERVE" : (isAI ? "BOT IS SERVING" : "WAITING FOR OPPONENT");
                statusEl.className = "mt-1 md:mt-2 text-[8px] md:text-[10px] font-bold text-slate-300 uppercase tracking-widest";
            } else if (state.status === 'rally') {
                statusEl.textContent = `RALLY: ${rallyCount}`;
                statusEl.className = "mt-1 md:mt-2 text-[8px] md:text-[10px] font-bold text-white bg-slate-700 px-3 py-0.5 rounded-full uppercase tracking-widest";
            }
        }

        function updatePhysics() {
            if (!isHost || state.status !== 'rally') return;

            const b = state.ball;
            b.x += b.vx;
            b.y += b.vy;
            b.z += b.vz;

            b.vy -= GRAVITY; 

            // Table collision
            if (b.y <= 0.60 && b.z > -TABLE_LENGTH/2 && b.z < TABLE_LENGTH/2 && b.x > -TABLE_WIDTH/2 && b.x < TABLE_WIDTH/2) {
                if (b.vy < 0) {
                    b.vy = Math.abs(b.vy) * 0.82; 
                    b.y = 0.60;
                    state.tableHit = (b.z > 0) ? 'p1' : 'p2';
                }
            }

            // Net collision
            if (Math.abs(b.z) < 0.6 && b.y < 2.2 && b.x > -TABLE_WIDTH/2 -1 && b.x < TABLE_WIDTH/2 + 1) {
                if ((b.z > 0 && b.vz < 0) || (b.z < 0 && b.vz > 0)) {
                    b.vz = -b.vz * 0.3; 
                    b.z = b.z > 0 ? 0.65 : -0.65;
                }
            }

            // P1 Paddle collision
            if (b.z > TABLE_LENGTH/2 && b.z < TABLE_LENGTH/2 + 1.8 && b.vz > 0) {
                const dx = b.x - state.p1.x;
                const dy = b.y - state.p1.y;
                if (Math.sqrt(dx*dx + dy*dy) < 2.8) { 
                    b.vz = -0.38; 
                    b.vy = 0.22 + (state.p1.y - b.y) * 0.05; 
                    b.vx = dx * 0.15; 
                    rallyCount++;
                    state.lastHit = 'p1';
                    state.tableHit = null;
                    updateStatusUI();
                }
            }

            // P2/AI Paddle collision
            if (b.z < -TABLE_LENGTH/2 && b.z > -TABLE_LENGTH/2 - 1.8 && b.vz < 0) {
                const dx = b.x - state.p2.x;
                const dy = b.y - state.p2.y;
                if (Math.sqrt(dx*dx + dy*dy) < 2.8) {
                    b.vz = 0.38; 
                    b.vy = 0.22 + (state.p2.y - b.y) * 0.05;
                    b.vx = dx * 0.15;
                    rallyCount++;
                    state.lastHit = 'p2';
                    state.tableHit = null;
                    updateStatusUI();
                }
            }

            // Scoring
            if (b.y < -4) {
                if (state.lastHit === 'p1') {
                    if (state.tableHit === 'p2') {
                        state.score.p1++;
                        state.server = 'p1'; 
                    } else {
                        state.score.p2++;
                        state.server = 'p2';
                    }
                } else if (state.lastHit === 'p2') {
                    if (state.tableHit === 'p1') {
                        state.score.p2++;
                        state.server = 'p2';
                    } else {
                        state.score.p1++;
                        state.server = 'p1';
                    }
                } else {
                    if (b.z > 0) {
                        state.score.p2++;
                        state.server = 'p2'; 
                    } else {
                        state.score.p1++;
                        state.server = 'p1';
                    }
                }
                
                checkWinCondition();
            }

            // AI Movement logic
            if (isAI) {
                const aiTargetX = b.x;
                const aiTargetY = Math.max(1, b.y - 0.5); 
                const aiSpeed = 0.06 + (rallyCount * 0.003); 
                
                state.p2.x += (aiTargetX - state.p2.x) * aiSpeed;
                state.p2.y += (aiTargetY - state.p2.y) * aiSpeed;
            }

            if (conn && conn.open && !isAI) {
                conn.send({ type: 'stateUpdate', state: state });
            }
        }

        function checkWinCondition() {
            if (state.score.p1 >= MAX_SCORE) {
                state.status = 'gameover';
                state.winner = 'p1';
            } else if (state.score.p2 >= MAX_SCORE) {
                state.status = 'gameover';
                state.winner = 'p2';
            } else {
                setupServe();
            }
            updateScoreUI();
        }

        function syncState(newState) {
            const oldStatus = state.status;
            state = newState;
            updateScoreUI();
            
            if (oldStatus !== state.status) {
                updateStatusUI();
            }
        }

        function updateScoreUI() {
            document.getElementById('scoreP1').textContent = String(state.score.p1).padStart(2, '0');
            document.getElementById('scoreP2').textContent = String(state.score.p2).padStart(2, '0');

            if (state.status === 'gameover') {
                const wText = document.getElementById('winnerText');
                if (state.winner === 'p1') {
                    wText.textContent = document.getElementById('p1NameLabel').textContent;
                    wText.className = "text-5xl md:text-7xl font-black text-pink-500 mb-8 md:mb-12 uppercase tracking-tighter text-center px-4";
                } else {
                    wText.textContent = document.getElementById('p2NameLabel').textContent;
                    wText.className = `text-5xl md:text-7xl font-black ${isAI ? 'text-purple-500' : 'text-cyan-500'} mb-8 md:mb-12 uppercase tracking-tighter text-center px-4`;
                }
                gameOverPanel.classList.remove('hidden');
            } else {
                gameOverPanel.classList.add('hidden');
            }
        }

        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            
            if (camera.aspect < 1) {
                camera.fov = 70;
            } else {
                camera.fov = 45;
            }
            
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderVisuals() {
            objects.p1.position.x += (state.p1.x - objects.p1.position.x) * 0.25;
            objects.p1.position.y += (state.p1.y - objects.p1.position.y) * 0.25;
            objects.p1.rotation.y = -objects.p1.position.x * 0.04; 
            objects.p1.rotation.z = objects.p1.position.x * 0.04;

            objects.p2.position.x += (state.p2.x - objects.p2.position.x) * 0.25;
            objects.p2.position.y += (state.p2.y - objects.p2.position.y) * 0.25;
            objects.p2.rotation.y = -objects.p2.position.x * 0.04;
            objects.p2.rotation.z = objects.p2.position.x * 0.04;

            objects.ball.position.x = state.ball.x;
            objects.ball.position.y = state.ball.y;
            objects.ball.position.z = state.ball.z;

            if (!isHost && !isAI) {
                camera.position.set(0, 18, -34);
                camera.lookAt(0, -2, 0);
            } else {
                camera.position.set(0, 18, 34);
                camera.lookAt(0, -2, 0);
            }
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            if (gameActive) {
                updatePhysics();
                
                // AI Auto Serve
                if (isAI && state.status === 'serve' && state.server === 'p2') {
                    aiServeTimer++;
                    if (aiServeTimer > 60) {
                        executeServe();
                        aiServeTimer = 0;
                    }
                }
            }
            renderVisuals();
            
            renderer.render(scene, camera);
        }

        gameLoop();

    </script>
</body>
</html>
